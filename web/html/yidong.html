    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        .container {

        .alert-item {

        .alert-header {

        .alert-level.medium { background: #ffaa00; color: black; }
        .alert-level.low { background: #00aa00; color: white; }
        
        .alert-content {

            gap: 8px;

        }
        
        .alert-reason {

        }

        }

        .change-negative { color: #00aa00; }
        
        .alert-time {

            margin-top: 5px;

        }
        
        .detail-item {

        @keyframes slideDown {
            0% {
                transform: translateY(-100%);
                opacity: 0;
                max-height: 0;
                margin-bottom: 0;
            }
            70% {
                transform: translateY(5%);
                opacity: 0.8;
            }
            100% {
                transform: translateY(0);
                opacity: 1;
                max-height: 200px;
                margin-bottom: 0;
            }
        }
        
        @keyframes slideUp {
            0% {
                transform: translateY(0);
                opacity: 1;
                max-height: 200px;
            }
            100% {
                transform: translateY(-100%);
                opacity: 0;
                max-height: 0;
                margin-bottom: 0;
                padding-top: 0;
                padding-bottom: 0;
            }

        @keyframes pushDown {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(calc(100% + 8px));
            }
        }

    <script>
        class ShortTermSpirit {
            constructor() {
                this.ws = null;
                this.allAlerts = []; // 存储所有警报（受maxStorageAlerts限制）
                this.filteredAlerts = []; // 存储筛选后的警报（受maxDisplayAlerts限制）
                this.alertCounts = { high: 0, medium: 0, low: 0, total: 0 };
                this.cumulativeCounts = { high: 0, medium: 0, low: 0, total: 0 }; // 新增：累计统计
                this.maxStorageAlerts = 200; // 存储的最大警报数量
                this.maxDisplayAlerts = 100; // 显示的最大警报数量
                this.reconnectDelay = 1000;
                this.messageCount = 0;
                this.autoScroll = true;
                this.dataPersistence = true;
                this.sessionId = this.generateSessionId();
                this.lastProcessedTimestamps = new Set();
                this.isFiltering = false;
                this.pendingAlerts = [];
                
                // 筛选条件
                this.filters = {
                    levels: ['high', 'medium', 'low'],
                    types: ['封单异动', '成交额异动', '其他'],
                    minStrength: 0
                };
                
                // UI状态
                this.uiState = {
                    autoScroll: true,
                    dataPersistence: true,
                    filters: this.filters
                };
                
                this.init();
            }
            
            init() {
                this.loadFromStorage();
                this.applyUIFilters();
                this.updateStatsDisplay();
                // this.renderAlerts();
                 // 修复：确保数据正确渲染
                if (this.allAlerts.length > 0) {
                    this.applyFilters(); // 如果有历史数据，立即应用筛选
                } else {
                    this.renderAlerts(); // 如果没有数据，显示等待消息
                }
                this.connect();
            }
            
            connect() {
                try {
                    this.addDebugInfo('尝试连接 WebSocket...');
                    this.ws = new WebSocket('ws://115.190.156.240:8080/ws');
                    
                    this.ws.onopen = () => {
                        console.log('✅ WebSocket连接成功');
                        this.addDebugInfo('✅ WebSocket连接成功');
                        this.updateConnectionStatus(true);
                        this.reconnectDelay = 1000;
                    };
                    
                    this.ws.onmessage = (event) => {
                        this.messageCount++;
                        console.log(`📨 收到消息 #${this.messageCount}:`, event.data);
                        
                        try {
                            const data = JSON.parse(event.data);
                            
                            if (data.type === 'volatile_alert') {
                                // 如果正在筛选，将警报放入待处理队列
                                if (this.isFiltering) {
                                    this.pendingAlerts.push(data);
                                } else {
                                    this.handleAlert(data);
                                }
                            } else if (data.type === 'system') {
                                this.addDebugInfo(`系统消息: ${data.message}`);
                            }
                        } catch (e) {
                            console.error('消息解析错误:', e);
                        }
                    };
                    
                    this.ws.onclose = (event) => {
                        console.log('❌ WebSocket连接关闭:', event.code, event.reason);
                        this.addDebugInfo(`❌ 连接关闭: ${event.code} - ${event.reason}`);
                        this.updateConnectionStatus(false);
                        setTimeout(() => this.connect(), this.reconnectDelay);
                        this.reconnectDelay = Math.min(this.reconnectDelay * 2, 10000);
                    };
                    
                    this.ws.onerror = (error) => {
                        console.error('WebSocket错误:', error);
                        this.addDebugInfo('❌ WebSocket连接错误');
                    };
                    
                } catch (error) {
                    console.error('连接失败:', error);
                    this.addDebugInfo(`❌ 连接失败: ${error.message}`);
                    setTimeout(() => this.connect(), this.reconnectDelay);
                }
            }
            
            handleAlert(alertData) {
                // 检查是否已处理过此警报（基于时间戳）
                const alertKey = `${alertData.symbol}_${alertData.timestamp}`;
                if (this.lastProcessedTimestamps.has(alertKey)) {
                    return;
                }
                
                // 添加到已处理集合
                this.lastProcessedTimestamps.add(alertKey);
                
                // 添加到所有警报（存储限制）
                this.allAlerts.unshift(alertData);
                
                // 限制存储数据量（避免内存泄漏）
                if (this.allAlerts.length > this.maxStorageAlerts) {
                    const removedAlert = this.allAlerts.pop();
                    const removedKey = `${removedAlert.symbol}_${removedAlert.timestamp}`;
                    this.lastProcessedTimestamps.delete(removedKey);
                }
                
                // 更新统计（包括累计统计）
                this.updateStats(alertData);
                
                // 应用筛选
                this.applyFilters();
                
                // 保存到本地存储（如果启用持久化）
                if (this.dataPersistence) {
                    this.saveToStorage();
                }
            }
            
            updateStats(alertData) {
                // 重置当前统计（基于存储的数据）
                this.alertCounts = { high: 0, medium: 0, low: 0, total: this.allAlerts.length };
                
                // 计算当前存储数据的各级别数量
                this.allAlerts.forEach(alert => {
                    this.alertCounts[alert.alert_level]++;
                });
                
                // 更新累计统计（不受存储限制）
                this.cumulativeCounts.total++;
                if (alertData && alertData.alert_level) {
                    this.cumulativeCounts[alertData.alert_level]++;
                }
                
                this.updateStatsDisplay();
            }
            
            updateStatsDisplay() {
                // 显示累计统计，不受存储限制
                document.getElementById('highCount').textContent = this.cumulativeCounts.high;
                document.getElementById('mediumCount').textContent = this.cumulativeCounts.medium;
                document.getElementById('lowCount').textContent = this.cumulativeCounts.low;
                document.getElementById('totalCount').textContent = this.cumulativeCounts.total;
            }
            
            applyFilters() {
                // 先筛选所有存储的数据
                let filtered = this.allAlerts.filter(alert => {
                    // 检查级别筛选
                    if (!this.filters.levels.includes(alert.alert_level)) {
                        return false;
                    }
                    
                    // 检查类型筛选
                    if (!this.filters.types.includes(alert.action_text)) {
                        return false;
                    }
                    
                    // 检查强度筛选
                    if (alert.strength < this.filters.minStrength) {
                        return false;
                    }
                    
                    return true;
                });
                
                // 限制显示数量（提高性能）
                this.filteredAlerts = filtered.slice(0, this.maxDisplayAlerts);
                
                this.renderAlerts();
            }
            
            renderAlerts() {
                const container = document.getElementById('alertsContainer');
                
                if (this.filteredAlerts.length === 0) {
                    container.innerHTML = '<div class="no-alerts">暂无符合条件的异动数据</div>';
                    return;
                }
                
                // 清除等待消息
                if (container.innerHTML.includes('等待连接') || container.innerHTML.includes('等待异动数据')) {
                    container.innerHTML = '';
                }
                
                // 添加平滑过渡类
                container.classList.add('smooth-transition');
                
                // 清空容器
                container.innerHTML = '';
                
                // 添加所有警报项
                this.filteredAlerts.forEach((alert, index) => {
                    const alertElement = this.createAlertElement(alert);
                    
                    // 如果是第一个元素（最新），添加入场动画
                    if (index === 0) {
                        setTimeout(() => {
                            alertElement.classList.add('animate-in');
                        }, 10);
                    }
                    
                    container.appendChild(alertElement);
                });
                
                // 移除平滑过渡类（只在渲染完成后）
                setTimeout(() => {
                    container.classList.remove('smooth-transition');
                }, 300);
                
                // 自动滚动到底部
                if (this.autoScroll) {
                    container.scrollTop = 0;
                }
            }
            
            createAlertElement(alert) {
                const alertElement = document.createElement('div');
                alertElement.className = `alert-item ${alert.alert_level}`;
                
                const changeClass = alert.change_5min >= 0 ? 'change-positive' : 'change-negative';
                const changeSign = alert.change_5min >= 0 ? '+' : '';
                
                // 格式化大数字为万/亿单位
                const formatLargeNumber = (num) => {
                    // 检查是否为有效数字
                    if (num === undefined || num === null) {
                        return '0';
                    }
                    
                    // 转换为数字
                    const numberValue = Number(num);
                    if (isNaN(numberValue)) {
                        return '0';
                    }
                    const absNum = Math.abs(num);
                    if (absNum >= 100000000) {
                        return (num / 100000000).toFixed(1) + '亿';
                    } else if (absNum >= 10000) {
                        return (num / 10000).toFixed(0) + '万';
                    }
                    return num.toString();
                };
                
                alertElement.innerHTML = `
                    <div class="alert-header">
                        <div class="stock-info">
                            <span class="stock-symbol">${alert.name}</span>
                            <span class="alert-reason">${alert.action_text}</span>
                        </div>
                        <div class="alert-meta">
                            <span class="alert-level ${alert.alert_level}">${alert.level_text}</span>
                            <span class="alert-time">${alert.display_time}</span>
                        </div>
                    </div>
                    
                    <div class="alert-content">
                        <div class="price-section">
                            <span class="price-label">现价</span>
                            <span class="price-value">${alert.price}</span>
                            <span class="change-5min ${changeClass}">${alert.change}% ${changeSign}${alert.change_5min}%</span>
                        </div>
                        
                        <div class="data-grid">
                            <div class="data-item">
                                <span class="data-label">瞬时成交额</span>
                                <span class="data-value">${formatLargeNumber(alert.amount)}</span>
                            </div>
                            <div class="data-item">
                                <span class="data-label">5分大单</span>
                                <span class="data-value">${formatLargeNumber(alert.large_net_5min)}</span>
                            </div>
                            <div class="data-item">
                                <span class="data-label">5分成交额</span>
                                <span class="data-value">${formatLargeNumber(alert.amount_5min)}</span>
                            </div>
                        </div>
                    </div>
                `;
                
                return alertElement;
            }
            
            updateConnectionStatus(connected) {
                const statusElement = document.getElementById('connectionStatus');
                if (connected) {
                    statusElement.textContent = '✅ 已连接';
                    statusElement.className = 'status-connected';
                } else {
                    statusElement.textContent = '❌ 断开连接';
                    statusElement.className = 'status-disconnected';
                }
            }
            
            addDebugInfo(message) {
                const debugElement = document.getElementById('debugInfo');
                const time = new Date().toLocaleTimeString();
                const infoItem = document.createElement('div');
                infoItem.textContent = `[${time}] ${message}`;
                debugElement.appendChild(infoItem);
                
                // 限制调试信息数量
                if (debugElement.children.length > 10) {
                    debugElement.removeChild(debugElement.firstChild);
                }
                
                // 自动滚动到底部
                debugElement.scrollTop = debugElement.scrollHeight;
            }
            
            // 生成会话ID
            generateSessionId() {
                return 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            }
            
            // 本地存储方法
            saveToStorage() {
                try {
                    // 保存所有数据
                    localStorage.setItem('shortTermAlerts', JSON.stringify(this.allAlerts));
                    localStorage.setItem('shortTermFilters', JSON.stringify(this.filters));
                    localStorage.setItem('shortTermStats', JSON.stringify(this.alertCounts));
                    localStorage.setItem('shortTermCumulativeStats', JSON.stringify(this.cumulativeCounts));
                    localStorage.setItem('shortTermPersistence', JSON.stringify(this.dataPersistence));
                    localStorage.setItem('shortTermUIState', JSON.stringify(this.uiState));
                    localStorage.setItem('shortTermSession', this.sessionId);
                    // 保存限制设置
                    localStorage.setItem('shortTermLimits', JSON.stringify({
                        storage: this.maxStorageAlerts,
                        display: this.maxDisplayAlerts
                    }));
                } catch (e) {
                    console.error('保存到本地存储失败:', e);
                }
            }
            
            loadFromStorage() {
                try {
                    // 加载UI状态和筛选条件
                    const savedUIState = localStorage.getItem('shortTermUIState');
                    if (savedUIState) {
                        this.uiState = JSON.parse(savedUIState);
                        this.autoScroll = this.uiState.autoScroll;
                        this.dataPersistence = this.uiState.dataPersistence;
                        
                        if (this.uiState.filters) {
                            this.filters = this.uiState.filters;
                        }
                        
                        this.updateUIButtons();
                    }
                    
                    // 加载限制设置
                    const savedLimits = localStorage.getItem('shortTermLimits');
                    if (savedLimits) {
                        const limits = JSON.parse(savedLimits);
                        this.maxStorageAlerts = limits.storage || 200;
                        this.maxDisplayAlerts = limits.display || 100;
                    }
                    
                    // 检查是否是同一会话
                    const lastSession = localStorage.getItem('shortTermSession');
                    
                    // 如果禁用持久化或者是新会话，不清除数据
                    if (!this.dataPersistence || !lastSession) {
                        console.log('跳过加载历史数据: 持久化关闭或新会话');
                        return;
                    }
                    
                    // 加载警报数据
                    const savedAlerts = localStorage.getItem('shortTermAlerts');
                    if (savedAlerts) {
                        this.allAlerts = JSON.parse(savedAlerts);
                        console.log(`从存储加载了 ${this.allAlerts.length} 条警报`);
                        
                        // 重建已处理时间戳集合
                        this.lastProcessedTimestamps.clear();
                        this.allAlerts.forEach(alert => {
                            const alertKey = `${alert.symbol}_${alert.timestamp}`;
                            this.lastProcessedTimestamps.add(alertKey);
                        });
                        
                        // 修复：加载数据后立即更新统计
                        this.updateStats(); // 不传入alertData，只基于现有数据更新
                    }
                    
                    // 加载当前统计信息
                    const savedStats = localStorage.getItem('shortTermStats');
                    if (savedStats) {
                        this.alertCounts = JSON.parse(savedStats);
                    }
                    
                    // 加载累计统计信息
                    const savedCumulativeStats = localStorage.getItem('shortTermCumulativeStats');
                    if (savedCumulativeStats) {
                        this.cumulativeCounts = JSON.parse(savedCumulativeStats);
                    } else {
                        // 如果没有累计统计，从当前统计初始化（兼容旧版本）
                        this.cumulativeCounts = { ...this.alertCounts };
                    }
                } catch (e) {
                    console.error('从本地存储加载失败:', e);
                }
            }
            
            applyUIFilters() {
                // 更新级别筛选
                const levelCheckboxes = document.querySelectorAll('input[name="level"]');
                levelCheckboxes.forEach(checkbox => {
                    checkbox.checked = this.filters.levels.includes(checkbox.value);
                });
                
                // 更新类型筛选
                const typeCheckboxes = document.querySelectorAll('input[name="type"]');
                typeCheckboxes.forEach(checkbox => {
                    checkbox.checked = this.filters.types.includes(checkbox.value);
                });
                
                // 更新强度筛选
                document.getElementById('strengthSlider').value = this.filters.minStrength;
                document.getElementById('strengthValue').textContent = this.filters.minStrength;
            }
            
            updateUIButtons() {
                // 更新自动滚动按钮
                const autoScrollBtn = document.getElementById('autoScrollBtn');
                autoScrollBtn.textContent = this.autoScroll ? '🔒 暂停滚动' : '🔓 开启滚动';
                
                // 更新持久化按钮
                const persistenceBtn = document.getElementById('persistenceBtn');
                persistenceBtn.textContent = this.dataPersistence ? '💾 持久化:开' : '💾 持久化:关';
            }
            
            clearAllData() {
                if (confirm('确定要清空所有股票异动数据吗？此操作将重置累计统计，不可撤销。')) {
                    // 清空所有数据
                    this.allAlerts = [];
                    this.filteredAlerts = [];
                    this.lastProcessedTimestamps.clear();
                    
                    // 重置所有统计（包括累计统计）
                    this.alertCounts = { high: 0, medium: 0, low: 0, total: 0 };
                    this.cumulativeCounts = { high: 0, medium: 0, low: 0, total: 0 };
                    
                    this.updateStatsDisplay();
                    this.renderAlerts();
                    
                    if (this.dataPersistence) {
                        this.saveToStorage();
                    }
                }
            }
            
            toggleAutoScroll() {
                this.autoScroll = !this.autoScroll;
                this.uiState.autoScroll = this.autoScroll;
                this.updateUIButtons();
                this.saveToStorage();
            }
            
            toggleDataPersistence() {
                this.dataPersistence = !this.dataPersistence;
                this.uiState.dataPersistence = this.dataPersistence;
                this.updateUIButtons();
                
                if (this.dataPersistence) {
                    // 开启持久化时保存当前数据
                    this.saveToStorage();
                } else {
                    // 关闭持久化时清除存储的数据
                    localStorage.removeItem('shortTermAlerts');
                    localStorage.removeItem('shortTermStats');
                    localStorage.removeItem('shortTermCumulativeStats');
                }
                
                this.saveToStorage(); // 保存持久化设置
            }
            
            // 处理筛选期间的待处理警报
            processPendingAlerts() {
                if (this.pendingAlerts.length > 0) {
                    this.addDebugInfo(`处理 ${this.pendingAlerts.length} 条待处理警报`);
                    
                    // 处理所有待处理警报
                    this.pendingAlerts.forEach(alert => {
                        this.handleAlert(alert);
                    });
                    
                    // 清空待处理队列
                    this.pendingAlerts = [];
                }
            }
            
            // 保存筛选条件到UI状态
            saveFiltersToUIState() {
                this.uiState.filters = {
                    levels: [...this.filters.levels],
                    types: [...this.filters.types],
                    minStrength: this.filters.minStrength
                };
            }
            
            // 新增：设置存储限制的方法
            setStorageLimit(limit) {
                this.maxStorageAlerts = limit;
                // 如果当前存储的数据超过新限制，需要截断
                if (this.allAlerts.length > this.maxStorageAlerts) {
                    const removeCount = this.allAlerts.length - this.maxStorageAlerts;
                    const removedAlerts = this.allAlerts.splice(-removeCount);
                    
                    // 从已处理集合中移除
                    removedAlerts.forEach(alert => {
                        const alertKey = `${alert.symbol}_${alert.timestamp}`;
                        this.lastProcessedTimestamps.delete(alertKey);
                    });
                    
                    this.applyFilters();
                    if (this.dataPersistence) {
                        this.saveToStorage();
                    }
                }
            }
            
            // 新增：设置显示限制的方法
            setDisplayLimit(limit) {
                this.maxDisplayAlerts = limit;
                this.applyFilters(); // 重新应用筛选以更新显示
            }
        }
        
        // 全局函数
        const spirit = new ShortTermSpirit();
        
        function applyFilters() {
            // 标记开始筛选
            spirit.isFiltering = true;
            
            // 获取级别筛选
            const levelCheckboxes = document.querySelectorAll('input[name="level"]:checked');
            spirit.filters.levels = Array.from(levelCheckboxes).map(cb => cb.value);
            
            // 获取类型筛选
            const typeCheckboxes = document.querySelectorAll('input[name="type"]:checked');
            spirit.filters.types = Array.from(typeCheckboxes).map(cb => cb.value);
            
            // 获取强度筛选
            spirit.filters.minStrength = parseInt(document.getElementById('strengthSlider').value);
            
            // 保存筛选条件到UI状态
            spirit.saveFiltersToUIState();
            
            // 应用筛选
            spirit.applyFilters();
            
            // 标记筛选结束
            spirit.isFiltering = false;
            
            // 处理筛选期间积累的警报
            spirit.processPendingAlerts();
            
            // 保存筛选条件
            spirit.saveToStorage();
        }
        
        function resetFilters() {
            // 重置级别筛选
            const levelCheckboxes = document.querySelectorAll('input[name="level"]');
            levelCheckboxes.forEach(cb => cb.checked = true);
            
            // 重置类型筛选
            const typeCheckboxes = document.querySelectorAll('input[name="type"]');
            typeCheckboxes.forEach(cb => cb.checked = true);
            
            // 重置强度筛选
            document.getElementById('strengthSlider').value = 0;
            document.getElementById('strengthValue').textContent = '0';
            
            // 应用重置后的筛选
            applyFilters();
        }
        
        function clearAllData() {
            spirit.clearAllData();
        }
        
        function toggleAutoScroll() {
            spirit.toggleAutoScroll();
        }
        
        function toggleDataPersistence() {
            spirit.toggleDataPersistence();
        }
        
        // 设置相关函数
        function showSettings() {
            document.getElementById('settingsDialog').style.display = 'block';
            document.getElementById('dialogOverlay').style.display = 'block';
            
            // 设置当前值
            document.getElementById('storageLimit').value = spirit.maxStorageAlerts;
            document.getElementById('displayLimit').value = spirit.maxDisplayAlerts;
        }
        
        function hideSettings() {
            document.getElementById('settingsDialog').style.display = 'none';
            document.getElementById('dialogOverlay').style.display = 'none';
        }
        
        function applySettings() {
            const storageLimit = parseInt(document.getElementById('storageLimit').value);
            const displayLimit = parseInt(document.getElementById('displayLimit').value);
            
            if (storageLimit >= 50 && displayLimit >= 20 && displayLimit <= storageLimit) {
                spirit.setStorageLimit(storageLimit);
                spirit.setDisplayLimit(displayLimit);
                hideSettings();
                spirit.addDebugInfo(`设置已更新: 存储${storageLimit}条, 显示${displayLimit}条`);
                // 保存限制设置
                spirit.saveToStorage();
            } else {
                alert('请输入有效的数值：存储≥50，显示≥20，且显示数量≤存储数量');
            }
        }
        
        // 初始化强度滑块
        document.addEventListener('DOMContentLoaded', function() {
            const strengthSlider = document.getElementById('strengthSlider');
            const strengthValue = document.getElementById('strengthValue');
            
            strengthSlider.addEventListener('input', function() {
                strengthValue.textContent = this.value;
            });
            
            // 添加重新连接功能
            const statusElement = document.getElementById('connectionStatus');
            statusElement.style.cursor = 'pointer';
            statusElement.title = '点击重新连接';
            statusElement.addEventListener('click', function() {
                spirit.connect();
            });
            
            // 点击遮罩关闭对话框
            document.getElementById('dialogOverlay').addEventListener('click', hideSettings);
        });
    </script>
</body>
</html>
