<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 复杂板块博弈资金流向系统 (简化版)</title>
    <script src="https://cdn.jsdelivr.net/npm/lodash@4.17.21/lodash.min.js"></script>
    <script src="https://unpkg.com/echarts@6.0.0/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1800px;
            margin: 0 auto;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: rgba(26, 26, 46, 0.95);
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid #333;
            backdrop-filter: blur(10px);
        }
        
        .header h1 {
            color: #d4af37;
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .header-subtitle {
            font-size: 14px;
            color: #aaa;
            margin-top: 5px;
        }
        
        .control-panel {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        
        .control-btn {
            background: rgba(40, 40, 60, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #e0e0e0;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .control-btn:hover {
            background: rgba(212, 175, 55, 0.2);
            border-color: #d4af37;
        }
        
        .control-btn.active {
            background: rgba(212, 175, 55, 0.3);
            border-color: #d4af37;
            color: #d4af37;
        }
        
        /* 主布局 */
        .main-content {
            display: grid;
            grid-template-columns: 3fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        /* 桑基图区域 */
        .sankey-section {
            background: rgba(26, 26, 46, 0.95);
            border-radius: 10px;
            padding: 20px;
            border: 1px solid #333;
            height: 900px;
            position: relative;
            overflow: hidden;
        }
        
        .sankey-info {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 12px;
            z-index: 100;
        }
        
        .sankey-controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }
        
        .chart-container {
            width: 100%;
            height: 100%;
        }
        
        /* 侧边面板 */
        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        /* 面板通用样式 */
        .panel {
            background: rgba(26, 26, 46, 0.95);
            border-radius: 10px;
            padding: 20px;
            border: 1px solid #333;
            backdrop-filter: blur(10px);
        }
        
        .panel-title {
            font-size: 18px;
            color: #d4af37;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        /* 资金类型面板 */
        .capital-panel {
            flex: 1;
        }
        
        .capital-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .capital-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: rgba(40, 40, 60, 0.6);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .capital-item:hover {
            background: rgba(50, 50, 70, 0.8);
            transform: translateX(5px);
        }
        
        .capital-item.active {
            border-color: #d4af37;
            background: rgba(212, 175, 55, 0.1);
        }
        
        /* 题材面板 */
        .theme-panel {
            flex: 1;
        }
        
        .theme-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
        }
        
        .theme-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            background: rgba(40, 40, 60, 0.6);
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }
        
        .theme-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        
        /* 个股面板 */
        .stock-panel {
            height: 300px;
        }
        
        .stock-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 240px;
            overflow-y: auto;
        }
        
        .stock-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            background: rgba(40, 40, 60, 0.6);
            border-radius: 6px;
            font-size: 12px;
        }
        
        /* 底部分析 */
        .bottom-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .analysis-panel {
            background: rgba(26, 26, 46, 0.95);
            border-radius: 10px;
            padding: 20px;
            border: 1px solid #333;
            height: 400px;
        }
        
        /* 响应式 */
        @media (max-width: 1200px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .sankey-section {
                height: 700px;
            }
            
            .bottom-panel {
                grid-template-columns: 1fr;
            }
        }
        
        /* 滚动条 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: rgba(212, 175, 55, 0.5);
            border-radius: 3px;
        }
        
        /* 动画效果 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease;
        }
        
        /* 流向控制面板 */
        .flow-controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .flow-control-btn {
            background: rgba(40, 40, 60, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #aaa;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .flow-control-btn.active {
            background: rgba(50, 150, 250, 0.3);
            border-color: #3296fa;
            color: #3296fa;
        }
        
        /* 颜色图例 */
        .color-legend {
            display: flex;
            gap: 15px;
            margin-top: 10px;
            font-size: 12px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>🎯 复杂板块博弈资金流向系统 (简化版)</h1>
                <div class="header-subtitle">流入方向显示 | 资金/题材双系列颜色 | 节点显示净流入</div>
            </div>
            <div class="control-panel">
                <button class="control-btn" id="showAllBtn" onclick="showAllFlows()">显示全部流向</button>
                <button class="control-btn" id="rushBtn" onclick="highlightCapital('rush')">抢跑资金</button>
                <button class="control-btn" id="trialBtn" onclick="highlightCapital('trial')">试错资金</button>
                <button class="control-btn" id="allinBtn" onclick="highlightCapital('allin')">梭哈资金</button>
                <button class="control-btn" onclick="resetHighlight()">重置</button>
            </div>
        </div>
        
        <div class="main-content">
            <!-- 复杂桑基图区域 -->
            <div class="sankey-section">
                <div class="panel-title">
                    资金流向桑基图
                    <div class="color-legend">
                        <div class="legend-item">
                            <div class="legend-color" style="background: #ff6b6b;"></div>
                            <span>抢跑资金</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color" style="background: #ffa726;"></div>
                            <span>试错资金</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color" style="background: #66bb6a;"></div>
                            <span>梭哈资金</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color" style="background: #52c41a;"></div>
                            <span>净流入</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color" style="background: #ff4d4f;"></div>
                            <span>净流出</span>
                        </div>
                    </div>
                </div>
                <div class="sankey-info">
                    节点: <span id="nodeCount">0</span> | 流向: <span id="flowCount">0</span> | 
                    总资金: <span id="capitalTotal">0</span>
                </div>
                <div id="sankeyChart" class="chart-container"></div>
                <div class="sankey-controls">
                    <button class="control-btn" onclick="toggleLabels()">切换标签</button>
                    <button class="control-btn" onclick="resetLayout()">重置布局</button>
                    <button class="control-btn" onclick="toggleFlowDirection()">切换流向方向</button>
                </div>
            </div>
            
            <!-- 侧边面板 -->
            <div class="side-panel">
                <!-- 资金类型面板 -->
                <div class="panel capital-panel">
                    <div class="panel-title">资金类型分布</div>
                    <div class="capital-list" id="capitalList">
                        <!-- 动态生成 -->
                    </div>
                </div>
                
                <!-- 题材热度面板 -->
                <div class="panel theme-panel">
                    <div class="panel-title">题材资金净流入</div>
                    <div class="theme-list" id="themeList">
                        <!-- 动态生成 -->
                    </div>
                </div>
                
                <!-- 个股面板 -->
                <div class="panel stock-panel">
                    <div class="panel-title">个股资金流向</div>
                    <div class="stock-list" id="stockList">
                        <!-- 动态生成 -->
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 底部分析面板 -->
        <div class="bottom-panel">
            <!-- 资金流向分析 -->
            <div class="analysis-panel">
                <div class="panel-title">📊 资金类型流向分布</div>
                <div id="flowAnalysis" class="chart-container"></div>
            </div>
            
            <!-- 个股热度分析 -->
            <div class="analysis-panel">
                <div class="panel-title">🔥 个股净流入排名</div>
                <div id="stockFlowAnalysis" class="chart-container"></div>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let sankeyChart = null;
        let flowAnalysisChart = null;
        let stockFlowChart = null;
        
        // 颜色定义
        const COLOR_SCHEMES = {
            // 资金系列颜色（用于资金类型）
            capital: {
                rush: '#ff6b6b',      // 抢跑资金 - 亮红色
                trial: '#ffa726',     // 试错资金 - 橙色
                allin: '#66bb6a',     // 梭哈资金 - 绿色
                inflow: '#52c41a',    // 流入颜色
                outflow: '#ff4d4f'    // 流出颜色
            },
            
            // 题材系列颜色（用于不同题材）
            themes: {
                // 通信板块 - 蓝色系
                communication: ['#1890ff', '#40a9ff', '#69c0ff', '#91d5ff', '#bae7ff'],
                // 军工板块 - 红色系
                military: ['#ff4d4f', '#ff7875', '#ff9c8a', '#ffc1b3', '#ffe6e0'],
                // 芯片板块 - 紫色系
                chip: ['#722ed1', '#9254de', '#b37feb', '#d3adf7', '#f0f5ff'],
                // 锂电池 - 绿色系
                battery: ['#52c41a', '#73d13d', '#95de64', '#b7eb8f', '#d9f7be'],
                // 机器人 - 橙色系
                robot: ['#fa8c16', '#faad14', '#ffc53d', '#ffd666', '#fff1b8']
            }
        };
        
        // 模拟数据 - 简化版，只包含流入方向
        const mockData = {
            // 资金类型
            capitalTypes: [
                { 
                    id: 'rush',

                },
                { 
                    id: 'trial', 
                    name: '试错资金', 
                    color: COLOR_SCHEMES.capital.trial, 
                    description: '探索性资金，寻找新方向'
                },
                { 
                    id: 'allin', 
                    name: '梭哈资金', 
                    color: COLOR_SCHEMES.capital.allin, 
                    description: '重仓资金，确认趋势后介入'
                }
            ],
            
            // 大题材
            majorThemes: [
                { 
                    id: 'communication', 
                    name: '通信', 
                    baseColor: COLOR_SCHEMES.themes.communication[0],
                    subThemeColors: COLOR_SCHEMES.themes.communication.slice(1)
                },
                { 
                    id: 'military', 
                    name: '军工', 
                    baseColor: COLOR_SCHEMES.themes.military[0],
                    subThemeColors: COLOR_SCHEMES.themes.military.slice(1)
                },
                { 
                    id: 'chip', 
                    name: '芯片', 
                    baseColor: COLOR_SCHEMES.themes.chip[0],
                    subThemeColors: COLOR_SCHEMES.themes.chip.slice(1)
                },
                { 
                    id: 'battery', 
                    name: '锂电池', 
                    baseColor: COLOR_SCHEMES.themes.battery[0],
                    subThemeColors: COLOR_SCHEMES.themes.battery.slice(1)
                },
                { 
                    id: 'robot', 
                    name: '机器人', 
                    baseColor: COLOR_SCHEMES.themes.robot[0],
                    subThemeColors: COLOR_SCHEMES.themes.robot.slice(1)
                }
            ],
            
            // 细分题材
            subThemes: [
                // 通信细分题材
                { id: 'optical-module', name: '光模块', parent: 'communication', colorIndex: 0 },
                { id: 'cpo-mpo', name: 'CPO/MPO', parent: 'communication', colorIndex: 1 },
                { id: 'pcb', name: '印制电路板', parent: 'communication', colorIndex: 2 },
                { id: '5g', name: '5G', parent: 'communication', colorIndex: 3 },
                { id: 'switch', name: '交换机', parent: 'communication', colorIndex: 4 },
                
                // 军工细分题材
                { id: 'aero-engine', name: '航空发动机', parent: 'military', colorIndex: 0 },
                { id: 'military-electronics', name: '军工电子', parent: 'military', colorIndex: 1 },
                { id: 'military-material', name: '军工材料', parent: 'military', colorIndex: 2 },
                { id: 'chengfei', name: '成飞概念', parent: 'military', colorIndex: 3 },
                { id: 'military-radar', name: '军用雷达', parent: 'military', colorIndex: 4 },
                
                // 芯片细分题材
                { id: 'chip-design', name: '芯片设计', parent: 'chip', colorIndex: 0 },
                { id: 'semiconductor', name: '半导体', parent: 'chip', colorIndex: 1 },
                { id: 'eda', name: 'EDA', parent: 'chip', colorIndex: 2 },
                
                // 锂电池细分题材
                { id: 'lithium-mine', name: '锂矿', parent: 'battery', colorIndex: 0 },
                { id: 'cathode-material', name: '正极材料', parent: 'battery', colorIndex: 1 },
                { id: 'battery-cell', name: '电池', parent: 'battery', colorIndex: 2 },
                
                // 机器人细分题材
                { id: 'controller', name: '控制器', parent: 'robot', colorIndex: 0 },
                { id: 'reducer', name: '减速器', parent: 'robot', colorIndex: 1 },
                { id: 'servo-motor', name: '伺服电机', parent: 'robot', colorIndex: 2 }
            ],
            
            // 个股数据
            stocks: [
                // 通信板块个股
                { code: '300308', name: '中际旭创', themes: ['optical-module', 'cpo-mpo'], 
                  capitalFlow: 3.5, marketCap: 1500, dailyGain: 6.8, trend: 'up',
                  inflow: 4.2, outflow: 0.7 },
                { code: '002463', name: '沪电股份', themes: ['pcb'], 
                  capitalFlow: 1.8, marketCap: 450, dailyGain: 4.2, trend: 'up',
                  inflow: 2.3, outflow: 0.5 },
                { code: '000063', name: '中兴通讯', themes: ['5g', 'switch'], 
                  capitalFlow: 2.3, marketCap: 1800, dailyGain: 3.5, trend: 'up',
                  inflow: 2.8, outflow: 0.5 },
                { code: '300394', name: '天孚通信', themes: ['optical-module'], 
                  capitalFlow: 1.5, marketCap: 380, dailyGain: 8.2, trend: 'up',
                  inflow: 2.1, outflow: 0.6 },
                
                // 军工板块个股
                { code: '600893', name: '航发动力', themes: ['aero-engine'], 
                  capitalFlow: 2.1, marketCap: 1200, dailyGain: 3.8, trend: 'up',
                  inflow: 2.6, outflow: 0.5 },
                { code: '002179', name: '中航光电', themes: ['military-electronics'], 
                  capitalFlow: 1.2, marketCap: 800, dailyGain: 2.5, trend: 'up',
                  inflow: 1.8, outflow: 0.6 },
                { code: '600760', name: '中航沈飞', themes: ['chengfei'], 
                  capitalFlow: 1.8, marketCap: 1100, dailyGain: 4.2, trend: 'up',
                  inflow: 2.2, outflow: 0.4 },
                
                // 芯片板块个股
                { code: '603986', name: '兆易创新', themes: ['chip-design'], 
                  capitalFlow: -0.5, marketCap: 900, dailyGain: -1.2, trend: 'down',
                  inflow: 0.8, outflow: 1.3 },
                { code: '603501', name: '韦尔股份', themes: ['chip-design'], 
                  capitalFlow: -0.8, marketCap: 1200, dailyGain: -2.1, trend: 'down',
                  inflow: 0.6, outflow: 1.4 },
                { code: '300782', name: '卓胜微', themes: ['chip-design'], 
                  capitalFlow: 0.3, marketCap: 650, dailyGain: 0.8, trend: 'sideways',
                  inflow: 1.2, outflow: 0.9 },
                
                // 锂电池板块个股
                { code: '300750', name: '宁德时代', themes: ['lithium-mine', 'battery-cell'], 
                  capitalFlow: 4.2, marketCap: 8500, dailyGain: 2.8, trend: 'up',
                  inflow: 5.1, outflow: 0.9 },
                { code: '002460', name: '赣锋锂业', themes: ['lithium-mine'], 
                  capitalFlow: 1.5, marketCap: 1200, dailyGain: 3.5, trend: 'up',
                  inflow: 2.0, outflow: 0.5 },
                
                // 机器人板块个股
                { code: '002747', name: '埃斯顿', themes: ['controller'], 
                  capitalFlow: 1.2, marketCap: 280, dailyGain: 5.2, trend: 'up',
                  inflow: 1.8, outflow: 0.6 },
                { code: '002472', name: '双环传动', themes: ['reducer'], 
                  capitalFlow: 1.0, marketCap: 220, dailyGain: 4.8, trend: 'up',
                  inflow: 1.5, outflow: 0.5 },
                { code: '688017', name: '绿的谐波', themes: ['reducer'], 
                  capitalFlow: 0.8, marketCap: 180, dailyGain: 3.5, trend: 'up',
                  inflow: 1.3, outflow: 0.5 }
            ],
            
            // 生成资金流向数据（简化无环版本）
            generateCapitalFlows() {
                const flows = [];
                const capitalTypes = this.capitalTypes;
                const majorThemes = this.majorThemes;
                const subThemes = this.subThemes;
                const stocks = this.stocks;
                
                // 1. 资金类型 -> 大题材
                capitalTypes.forEach(capital => {
                    majorThemes.forEach(theme => {
                        const baseValue = capital.id === 'rush' ? 1.5 : 
                                        capital.id === 'trial' ? 2.0 : 3.0;
                        const randomFactor = 0.5 + Math.random();
                        const value = baseValue * randomFactor;
                        
                        flows.push({
                            source: capital.name,
                            target: theme.name,
                            value: value,
                            capitalType: capital.id,
                            lineStyle: {
                                color: capital.color
                            }
                        });
                    });
                });
                
                // 2. 大题材 -> 细分题材
                majorThemes.forEach(theme => {
                    const relatedSubThemes = subThemes.filter(st => st.parent === theme.id);
                    relatedSubThemes.forEach(subTheme => {
                        const value = 1.0 + Math.random() * 2.0;
                        flows.push({
                            source: theme.name,
                            target: subTheme.name,
                            value: value,
                            lineStyle: {
                                color: this.getThemeFlowColor(theme.id)
                            }
                        });
                    });
                });
                
                // 3. 细分题材 -> 个股
                subThemes.forEach(theme => {
                    const relatedStocks = stocks.filter(stock => 
                        stock.themes.includes(theme.id)
                    );
                    
                    relatedStocks.forEach(stock => {
                        const inflowValue = stock.inflow * (0.3 + Math.random() * 0.4);
                        flows.push({
                            source: theme.name,
                            target: stock.name,
                            value: inflowValue,
                            stockCode: stock.code,
                            lineStyle: {
                                color: this.getThemeFlowColor(theme.parent)
                            }
                        });
                    });
                });
                
                return flows;
            },
            
            // 获取题材流向颜色
            getThemeFlowColor(themeId) {
                const theme = this.majorThemes.find(t => t.id === themeId);
                return theme ? theme.baseColor : '#1890ff';
            },
            
            // 获取细分题材颜色
            getSubThemeColor(subTheme) {
                const parentTheme = this.majorThemes.find(t => t.id === subTheme.parent);
                if (!parentTheme) return '#ccc';
                
                const colorIndex = subTheme.colorIndex || 0;
                return parentTheme.subThemeColors[colorIndex % parentTheme.subThemeColors.length] || 
                       parentTheme.baseColor;
            }
        };

        // 生成桑基图数据
        function generateSankeyData() {
            const nodes = [];
            const links = mockData.generateCapitalFlows();
            
            // 1. 添加资金类型节点
            mockData.capitalTypes.forEach(capital => {
                nodes.push({
                    name: capital.name,
                    category: 'capital',
                    depth: 0,
                    description: capital.description,
                    color: capital.color,
                    itemStyle: {
                        color: capital.color,
                        borderColor: '#fff',
                        borderWidth: 2
                    }
                });
            });
            
            // 2. 添加大题材节点
            mockData.majorThemes.forEach(theme => {
                const subThemeCount = mockData.subThemes.filter(st => st.parent === theme.id).length;
                nodes.push({
                    name: theme.name,
                    category: 'major-theme',
                    depth: 1,
                    subThemeCount: subThemeCount,
                    color: theme.baseColor,
                    itemStyle: {
                        color: theme.baseColor,
                        borderColor: '#fff',
                        borderWidth: 1
                    }
                });
            });
            
            // 3. 添加细分题材节点
            mockData.subThemes.forEach(theme => {
                const parentTheme = mockData.majorThemes.find(mt => mt.id === theme.parent);
                const themeColor = mockData.getSubThemeColor(theme);
                
                nodes.push({
                    name: theme.name,
                    category: 'sub-theme',
                    depth: 2,
                    parentTheme: parentTheme ? parentTheme.name : '独立题材',
                    color: themeColor,
                    itemStyle: {
                        color: themeColor,
                        borderColor: '#fff',
                        borderWidth: 1
                    }
                });
            });
            
            // 4. 添加个股节点
            mockData.stocks.forEach(stock => {
                nodes.push({
                    name: stock.name,
                    category: 'stock',
                    depth: 3,
                    code: stock.code,
                    capitalFlow: stock.capitalFlow,
                    dailyGain: stock.dailyGain,
                    inflow: stock.inflow,
                    outflow: stock.outflow,
                    themes: stock.themes.map(themeId => {
                        const theme = mockData.subThemes.find(st => st.id === themeId);
                        return theme ? theme.name : themeId;
                    }),
                    itemStyle: {
                        color: getStockColor(stock),
                        borderColor: stock.trend === 'up' ? '#2ed573' : 
                                    stock.trend === 'down' ? '#ff4757' : '#ff9f43',
                        borderWidth: stock.trend === 'up' ? 2 : 1
                    }
                });
            });
            
            return { nodes, links };
        }

            const capital = mockData.capitalTypes.find(c => c.id === capitalId);

        // 获取股票颜色
        function getStockColor(stock) {
            if (stock.capitalFlow > 1) {
                return lightenColor(COLOR_SCHEMES.capital.inflow, 30);
            } else if (stock.capitalFlow < -0.5) {
                return lightenColor(COLOR_SCHEMES.capital.outflow, 30);
            } else {
                return '#9b59b6';
            }
        }
        
        // 颜色变亮
        function lightenColor(color, percent) {
            const num = parseInt(color.replace('#', ''), 16);
            const amt = Math.round(2.55 * percent);
            const R = (num >> 16) + amt;
            const G = (num >> 8 & 0x00FF) + amt;
            const B = (num & 0x0000FF) + amt;
            
            return '#' + (
                0x1000000 +
                (R < 255 ? (R < 1 ? 0 : R) : 255) * 0x10000 +
                (G < 255 ? (G < 1 ? 0 : G) : 255) * 0x100 +
                (B < 255 ? (B < 1 ? 0 : B) : 255)
            ).toString(16).slice(1);
        }

            const currentOption = sankeyChart.getOption();
            const curveness = currentOption.series[0].lineStyle.curveness || 0.3;
            
            sankeyChart.setOption({
                series: {
                    lineStyle: {
                        curveness: -curveness
                    }
                }
            });
        }
    </script>
</body>
