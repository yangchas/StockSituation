            exportImage() {
                // 创建一个临时canvas用于导出
                const tempCanvas = document.createElement('canvas');
                const tempCtx = tempCanvas.getContext('2d');
                
                // 设置临时canvas大小
                tempCanvas.width = this.canvas.width * 2;
                tempCanvas.height = this.canvas.height * 2;
                
                // 绘制背景
                tempCtx.fillStyle = '#1a1a2e';
                tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
                
                // 保存当前状态
                const originalZoom = this.viewState.zoomLevel;
                const originalOffsetX = this.viewState.offsetX;
                const originalOffsetY = this.viewState.offsetY;
                const originalShowLabels = this.viewState.showLabels;
                
                // 临时设置为适合导出的状态
                this.viewState.zoomLevel = 1;
                this.viewState.offsetX = 0;
                this.viewState.offsetY = 0;
                this.viewState.showLabels = true;
                
                // 重新绘制到临时canvas
                this.drawToCanvas(tempCtx, tempCanvas.width, tempCanvas.height);
                
                // 恢复状态
                this.viewState.zoomLevel = originalZoom;
                this.viewState.offsetX = originalOffsetX;
                this.viewState.offsetY = originalOffsetY;
                this.viewState.showLabels = originalShowLabels;
                
                // 导出图片
                const link = document.createElement('a');
                link.href = tempCanvas.toDataURL('image/png');
                link.download = '资金流向图.png';
                link.click();
                
                // 重新绘制主canvas
                this.draw();
            }
            
            drawToCanvas(ctx, width, height) {
                // 清除画布
                ctx.clearRect(0, 0, width, height);
                
                // 绘制连接线
                this.links.forEach(link => {
                    const sourceNode = this.getNodeById(link.source);
                    const targetNode = this.getNodeById(link.target);
                    
                    if (!sourceNode || !targetNode) return;
                    
                    const sourceX = sourceNode.x * width;
                    const sourceY = sourceNode.y * height;
                    const targetX = targetNode.x * width;
                    const targetY = targetNode.y * height;
                    
                    // 设置线条样式
                    ctx.beginPath();
                    ctx.moveTo(sourceX, sourceY);
                    ctx.lineTo(targetX, targetY);
                    
                    ctx.strokeStyle = link.color;
                    ctx.lineWidth = link.width || 1;
                    ctx.globalAlpha = link.opacity || 0.6;
                    ctx.stroke();
                    
                    // 绘制箭头
                    this.drawArrowToCanvas(ctx, sourceX, sourceY, targetX, targetY, link.color, link.width || 1);
                    
                    // 恢复全局透明度
                    ctx.globalAlpha = 1.0;
                });
                
                // 绘制节点
                this.nodes.forEach(node => {
                    const x = node.x * width;
                    const y = node.y * height;
                    const size = this.calculateNodeSize(node.value);
                    
                    // 设置节点样式
                    ctx.beginPath();
                    ctx.arc(x, y, size, 0, Math.PI * 2);
                    
                    // 填充颜色
                    ctx.fillStyle = node.color;
                    ctx.fill();
                    
                    // 边框
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = node.value > 5 ? 2 : 1;
                    ctx.stroke();
                    
                    // 绘制标签
                    this.drawNodeLabelToCanvas(ctx, node, x, y, width, height);
                });
            }
            
            drawArrowToCanvas(ctx, sourceX, sourceY, targetX, targetY, color, lineWidth) {
                // 计算箭头方向
                const angle = Math.atan2(targetY - sourceY, targetX - sourceX);
                const arrowLength = 8;
                
                // 箭头点
                const arrowX = targetX - Math.cos(angle) * 5;
                const arrowY = targetY - Math.sin(angle) * 5;
                
                // 绘制箭头
                ctx.save();
                ctx.translate(arrowX, arrowY);
                ctx.rotate(angle);
                
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(-arrowLength, arrowLength / 2);
                ctx.lineTo(-arrowLength, -arrowLength / 2);
                ctx.closePath();
                
                ctx.fillStyle = color;
                ctx.fill();
                
                ctx.restore();
            }
            
            drawNodeLabelToCanvas(ctx, node, x, y, width, height) {
                const fontSize = 10;
                ctx.font = `${fontSize}px 'Microsoft YaHei', sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                let labelText = node.name;
                if (node.category === 'emotion' && node.floor) {
                    labelText += `\n${node.floor}板`;
                } else if ((node.category === 'core' || node.category === 'other') && node.gain !== undefined) {
                    const gainSymbol = node.gain >= 0 ? '+' : '';
                    labelText += `\n${gainSymbol}${node.gain.toFixed(1)}%`;
                } else if (labelText.length > 4) {
                    labelText = labelText.substring(0, 4) + '...';
                }
                
                const lines = labelText.split('\n');
                const lineHeight = fontSize * 1.2;
                const totalHeight = lines.length * lineHeight;
                
                // 绘制标签背景
                const maxLineWidth = Math.max(...lines.map(line => ctx.measureText(line).width));
                const padding = 3;
                
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(
                    x - maxLineWidth / 2 - padding,
                    y - totalHeight / 2 - padding,
                    maxLineWidth + padding * 2,
                    totalHeight + padding * 2
                );
                
                // 绘制标签文本
                ctx.fillStyle = '#fff';
                lines.forEach((line, index) => {
                    ctx.fillText(
                        line,
                        x,
                        y - totalHeight / 2 + lineHeight * (index + 0.5)
                    );
                });
            }
            
            // ========== 区域分隔绘制 ==========
            drawRegions() {
                const container = document.getElementById('regionContainer');
                container.innerHTML = '';
                
                // 应用缩放变换
                container.style.transform = `scale(${this.viewState.zoomLevel})`;
                
                // 定义区域
                const regions = [
                    {
                        name: '资金区',
                        left: '3%', width: '7%', top: '10%', bottom: '90%'
                    },
                    {
                        name: '题材区',
                        left: '11%', width: '28%', top: '5%', bottom: '95%'
                    },
                    {
                        name: '情绪区',
                        left: '50%', width: '45%', top: '5%', bottom: '55%'
                    },
                    {
                        name: '核心股',
                        left: '50%', width: '20%', top: '56%', bottom: '95%'
                    },
                    {
                        name: '其他股',
                        left: '75%', width: '20%', top: '56%', bottom: '95%'
                }
                ];
                
                // 绘制主区域
                regions.forEach(region => {
                    const regionDiv = document.createElement('div');
                    regionDiv.className = 'region';
                    regionDiv.style.left = region.left;
                    regionDiv.style.width = region.width;
                    regionDiv.style.top = region.top;
                    regionDiv.style.height = `calc(${region.bottom} - ${region.top})`;
                    container.appendChild(regionDiv);
                    
                    // 区域标签
                    const label = document.createElement('div');
                    label.className = 'region-label';
                    label.style.left = `calc(${region.left} + 5px)`;
                    label.style.top = region.top;
                    label.textContent = region.name;
                    container.appendChild(label);
                });
                
                // 绘制情绪区分层线
                const emotionFloors = [
                    { floor: 1, top: '5%', height: '15%', rows: 12 },
                    { floor: 2, top: '21%', height: '15%', rows: 12 },
                    { floor: 3, top: '37%', height: '9%', rows: 6 },
                    { floor: 4, top: '47%', height: '5%', rows: 5 },
                    { floor: 5, top: '53%', height: '3%', rows: 3 }
                ];
                
                emotionFloors.forEach(floor => {
                    // 分层线
                    const floorLine = document.createElement('div');
                    floorLine.className = 'emotion-floor';
                    floorLine.style.top = `calc(${floor.top} + ${floor.height})`;
                    container.appendChild(floorLine);
                    
                    // 分层标签
                    const floorLabel = document.createElement('div');
                    floorLabel.className = 'floor-label';
                    floorLabel.style.top = `calc(${floor.top} + ${floor.height} / 2)`;
                    floorLabel.style.left = '49%';
                    floorLabel.textContent = `${floor.floor}板`;
                    container.appendChild(floorLabel);
                });
            }
        }
        
        // 初始化图表管理器
        let graphManager;
        
        window.addEventListener('load', () => {
            graphManager = new GraphManager();
            console.log('提示: 按 Ctrl+R 可以重置所有节点位置');
            console.log('提示: 使用左侧密度控制滑块调整节点密度');
        });
    </script>
