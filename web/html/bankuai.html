            // 修复1: 增量更新个股数据，不重新创建DOM
            handleStockUpdate(data) {
                if (!data || !data.plate_id || !data.data || !Array.isArray(data.data)) {
                    return;
                }
                
                const isCurrentPlate = this.selectedPlate && this.selectedPlate.id === data.plate_id;
                const isCurrentSubPlate = this.selectedSubPlate && this.selectedSubPlate.id === data.plate_id;
                
                if (!isCurrentPlate && !isCurrentSubPlate) {
                    return;
                }
                
                // 更新缓存
                this.stocksCache.set(data.plate_id, data.data);
                
                // 使用requestAnimationFrame进行性能优化
                if (!this.updateScheduled) {
                    this.updateScheduled = true;
                    requestAnimationFrame((timestamp) => {
                        this.processStockUpdates(timestamp, data.data, data.plate_id);
                    });
                }
            }
            
            processStockUpdates(timestamp, newStocks, plateId) {
                // 动态调整渲染频率
                this.adjustRenderFrequency(timestamp);
                
                if (timestamp - this.lastRenderTime >= this.currentRenderInterval) {
                    // 增量更新显示
                    this.incrementalUpdateStocks(newStocks);
                    this.lastRenderTime = timestamp;
                }
                
                this.updateScheduled = false;
            }
            
            // 修复后的增量更新方法
            incrementalUpdateStocks(newStocks) {
                if (!this.virtualScroll.container) return;
                
                // 使用Map确保股票代码唯一性
                const stockMap = new Map();
                
                // 先添加新数据
                newStocks.forEach(stock => {
                    stockMap.set(stock.code, stock);
                });
                
                // 再添加当前数据中不在新数据中的股票
                this.currentStocks.forEach(stock => {
                    if (!stockMap.has(stock.code)) {
                        stockMap.set(stock.code, stock);
                    }
                });
                
                // 转换为数组并保持排序
                const mergedStocks = Array.from(stockMap.values());
                const sortedStocks = this.applyStockSortToArray(mergedStocks);
                
                this.currentStocks = sortedStocks;
                this.virtualScroll.totalStocks = sortedStocks.length;
                
                // 更新标题中的股票数量
                this.updateStockCountDisplay(sortedStocks.length);
                
                // 重新渲染虚拟滚动
                this.renderVisibleStocks(sortedStocks);
            }
            
            // 修复1: 更新单个股票行
            updateStockRow(stockCode, changes) {
                const row = document.getElementById(`stock-${stockCode}`);
                if (!row) return;
                
                const cells = row.querySelectorAll('div');
                if (cells.length < 6) return;
                
                // 更新涨跌幅
                if (changes.change_pct !== undefined) {
                    const changeCell = cells[2];
                    const changeClass = changes.change_pct >= 0 ? 'change-positive' : 'change-negative';
                    const changeSign = changes.change_pct >= 0 ? '+' : '';
                    
                    changeCell.textContent = `${changeSign}${(changes.change_pct * 100).toFixed(2)}%`;
                    changeCell.className = changeClass;
                    changeCell.classList.add('value-updated');
                    setTimeout(() => changeCell.classList.remove('value-updated'), 1000);
                }
                
                // 更新价格
                if (changes.price !== undefined) {
                    const priceCell = cells[3];
                    priceCell.textContent = changes.price.toFixed(2);
                    priceCell.classList.add('value-updated');
                    setTimeout(() => priceCell.classList.remove('value-updated'), 1000);
                }
                
                // 更新成交额
                if (changes.volume !== undefined) {
                    const volumeCell = cells[4];
                    volumeCell.textContent = this.formatNumber(changes.volume);
                    volumeCell.classList.add('value-updated');
                    setTimeout(() => volumeCell.classList.remove('value-updated'), 1000);
                }
                
                // 更新市值
                if (changes.market_cap !== undefined) {
                    const marketCapCell = cells[5];
                    marketCapCell.textContent = this.formatNumber(changes.market_cap);
                    marketCapCell.classList.add('value-updated');
                    setTimeout(() => marketCapCell.classList.remove('value-updated'), 1000);
                }
            }
            
            getStockChanges(oldStock, newStock) {
                const changes = {};
                const fields = ['change_pct', 'price', 'volume', 'market_cap'];
                
                fields.forEach(field => {
                    const oldVal = oldStock[field] || 0;
                    const newVal = newStock[field] || 0;
                    
                    if (field === 'change_pct' || field === 'price') {
                        if (Math.abs(oldVal - newVal) > 0.0001) {
                            changes[field] = newVal;
                        }
                    } else {
                        if (oldVal !== newVal) {
                            changes[field] = newVal;
                        }
                    }
                });
                
                return changes;
            }
            
            adjustRenderFrequency(timestamp) {
                if (timestamp - this.lastFpsCheck > 1000) {
                    const fps = this.frameCount;
                    this.frameCount = 0;
                    this.lastFpsCheck = timestamp;
                    
                    if (fps < 30 && this.currentRenderInterval > 8) {
                        this.currentRenderInterval = Math.min(this.currentRenderInterval * 1.5, 100);
                    } else if (fps > 50 && this.currentRenderInterval > 8) {
                        this.currentRenderInterval = Math.max(this.currentRenderInterval * 0.8, 8);
                    }
                }
                this.frameCount++;
            }
            
            // 修复2: 虚拟滚动实现
            setupVirtualScroll(container, stocks) {
                this.virtualScroll.container = container;
                this.virtualScroll.totalStocks = stocks.length;
                
                // 清空容器
                container.innerHTML = '';
                
                // 创建虚拟滚动容器
                const virtualContainer = document.createElement('div');
                virtualContainer.className = 'virtual-scroll-container';
                virtualContainer.style.height = '100%';
                
                const virtualContent = document.createElement('div');
                virtualContent.className = 'virtual-scroll-content';
                virtualContent.style.height = `${stocks.length * this.virtualScroll.rowHeight}px`;
                virtualContent.style.position = 'relative';
                
                virtualContainer.appendChild(virtualContent);
                container.appendChild(virtualContainer);
                
                this.virtualScroll.content = virtualContent;
                
                // 初始渲染
                this.renderVisibleStocks(stocks);
                
                // 添加滚动监听
                virtualContainer.addEventListener('scroll', () => {
                    this.handleVirtualScroll(stocks);
                });
            }
            
            // 修复后的虚拟滚动渲染方法
            renderVisibleStocks(stocks = null) {
                if (!this.virtualScroll.content) return;
                
                // 如果没有传入stocks参数，使用当前数据
                const displayStocks = stocks || this.currentStocks;
                
                const container = this.virtualScroll.container.querySelector('.virtual-scroll-container');
                const scrollTop = container ? container.scrollTop : 0;
                const containerHeight = container ? container.clientHeight : 0;
                
                // 计算可见区域
                this.virtualScroll.visibleStart = Math.floor(scrollTop / this.virtualScroll.rowHeight);
                this.virtualScroll.visibleEnd = Math.ceil((scrollTop + containerHeight) / this.virtualScroll.rowHeight);
                
                // 扩展缓冲区
                const start = Math.max(0, this.virtualScroll.visibleStart - this.virtualScroll.buffer);
                const end = Math.min(displayStocks.length, this.virtualScroll.visibleEnd + this.virtualScroll.buffer);
                
                // 使用Set检查重复，确保不重复渲染
                const renderedCodes = new Set();
                const fragment = document.createDocumentFragment();
                
                // 渲染可见股票
                for (let i = start; i < end; i++) {
                    const stock = displayStocks[i];
                    
                    // 检查是否已经渲染过这个股票代码
                    if (renderedCodes.has(stock.code)) {
                        console.log(`发现重复股票: ${stock.code} - ${stock.name}`);
                        continue;
                    }
                    
                    renderedCodes.add(stock.code);
                    const row = this.createVirtualStockRow(stock, i);
                    fragment.appendChild(row);
                }
                
                // 一次性更新DOM
                this.virtualScroll.content.innerHTML = '';
                this.virtualScroll.content.appendChild(fragment);
                
                // 渲染完成后清理重复元素
                setTimeout(() => {
                    const removedCount = this.cleanupDuplicateStockRows();
                    if (removedCount > 0) {
                        console.log(`清理了 ${removedCount} 个重复的股票行`);
                    }
                }, 0);
            }
            // 新增方法：清理重复的DOM元素
            cleanupDuplicateStockRows() {
                if (!this.virtualScroll.content) return 0;
                
                const rows = this.virtualScroll.content.querySelectorAll('.stock-row');
                const seenCodes = new Set();
                const duplicates = [];
                
                // 找出重复的股票行
                rows.forEach(row => {
                    const code = row.id.replace('stock-', '');
                    if (seenCodes.has(code)) {
                        duplicates.push(row);
                    } else {
                        seenCodes.add(code);
                    }
                });
                
                // 移除重复的行
                duplicates.forEach(row => {
                    console.warn(`移除重复DOM元素: ${row.id}`);
                    row.remove();
                });
                
                return duplicates.length;
            }
            createVirtualStockRow(stock, index) {
                const row = document.createElement('div');
                row.className = 'stock-row';
                row.id = `stock-${stock.code}`;
                row.style.top = `${index * this.virtualScroll.rowHeight}px`;
                row.style.height = `${this.virtualScroll.rowHeight}px`;
                 // 添加点击事件
                row.addEventListener('click', () => {
                    this.showStockDetail(stock);
                });
                const changeClass = stock.change_pct >= 0 ? 'change-positive' : 'change-negative';
                const changeSign = stock.change_pct >= 0 ? '+' : '';
                
                row.innerHTML = `
                    <div class="stock-name">${stock.name}</div>
                    <div class="stock-code">${stock.code}</div>
                    <div class="${changeClass}">${changeSign}${(stock.change_pct * 100).toFixed(2)}%</div>
                    <div>${stock.price ? stock.price.toFixed(2) : '--'}</div>
                    <div>${this.formatNumber(stock.volume)}</div>
                    <div>${this.formatNumber(stock.market_cap)}</div>
                `;
                
                return row;
            }
            
            handleVirtualScroll(stocks) {
                if (!this.virtualScroll.content) return;
                
                const container = this.virtualScroll.container.querySelector('.virtual-scroll-container');
                const scrollTop = container ? container.scrollTop : 0;
                const containerHeight = container ? container.clientHeight : 0;
                
                const newVisibleStart = Math.floor(scrollTop / this.virtualScroll.rowHeight);
                const newVisibleEnd = Math.ceil((scrollTop + containerHeight) / this.virtualScroll.rowHeight);
                
                // 如果可见区域变化不大，不重新渲染
                if (Math.abs(newVisibleStart - this.virtualScroll.visibleStart) < this.virtualScroll.buffer / 2 &&
                    Math.abs(newVisibleEnd - this.virtualScroll.visibleEnd) < this.virtualScroll.buffer / 2) {
                    return;
                }
                
                this.virtualScroll.visibleStart = newVisibleStart;
                this.virtualScroll.visibleEnd = newVisibleEnd;
                
                this.renderVisibleStocks(stocks);
            }
            
            updateStockCountDisplay(count) {
                const titleElement = document.querySelector('.stocks-section div:first-child');
                if (titleElement) {
                    const currentTitle = titleElement.textContent.split(' (')[0];
                    titleElement.textContent = `${currentTitle} (${count})`;
                }
            }
            
            // 修复3: 自动更新功能
            toggleAutoUpdate() {
                this.autoUpdate = !this.autoUpdate;
                const btn = document.getElementById('autoUpdateBtn');
                if (this.autoUpdate) {
                    btn.innerHTML = '<span>🔄</span> 自动更新:开';
                    btn.classList.add('active');
                    this.showMessage('✅ 已开启自动更新');
                    // 重新连接WebSocket获取最新数据
                    this.refreshData();
                } else {
                    btn.innerHTML = '<span>🔄</span> 自动更新:关';
                    btn.classList.remove('active');
                    this.showMessage('❌ 已关闭自动更新');
                    // 停止实时更新，但保留当前显示的数据
                }
            }
            
            // 修复4: 个股排序功能
            sortStocks(field) {
                // 切换排序方向
                if (this.stockSort.field === field) {
                    this.stockSort.direction = this.stockSort.direction === 'desc' ? 'asc' : 'desc';
                } else {
                    this.stockSort.field = field;
                    this.stockSort.direction = 'desc';
                }
                
                // 应用排序
                if (this.currentStocks.length > 0) {
                    const sortedStocks = this.applyStockSortToArray([...this.currentStocks]);
                    this.currentStocks = sortedStocks;
                    
                    // 更新显示
                    const title = this.getCurrentStockTitle();
                    this.renderStocksWithVirtualScroll(sortedStocks, title);
                    this.updateStockHeaderSortClasses();
                }
            }
            
            applyStockSortToArray(stocks) {
                if (stocks.length === 0) return stocks;
                
                stocks.sort((a, b) => {
                    let aVal = a[this.stockSort.field] || 0;
                    let bVal = b[this.stockSort.field] || 0;
                    
                    if (this.stockSort.field === 'name' || this.stockSort.field === 'code') {
                        return this.stockSort.direction === 'desc' ? 
                            bVal.localeCompare(aVal) : aVal.localeCompare(bVal);
                    }
                    
                    if (this.stockSort.direction === 'desc') {
                        return bVal - aVal;
                    } else {
                        return aVal - bVal;
                    }
                });
                
                return stocks;
            }
            
            updateStockHeaderSortClasses() {
                const headerItems = document.querySelectorAll('.stock-header-item');
                headerItems.forEach(item => {
                    item.classList.remove('sort-asc', 'sort-desc');
                });
                
                const currentHeader = document.querySelector(`.stock-header-item[onclick*="${this.stockSort.field}"]`);
                if (currentHeader) {
                    currentHeader.classList.add(this.stockSort.direction === 'desc' ? 'sort-desc' : 'sort-asc');
                }
            }
            
            // 修复4: 使用虚拟滚动渲染股票
            renderStocksWithVirtualScroll(stocks, title) {
                const container = this.domCache.plateDetails;
                let stocksSection = container.querySelector('.stocks-section');
                
                if (!stocksSection) {
                    stocksSection = document.createElement('div');
                    stocksSection.className = 'stocks-section';
                    container.appendChild(stocksSection);
                }
                
                const getSortClass = (field) => {
                    if (this.stockSort.field === field) {
                        return this.stockSort.direction === 'desc' ? 'sort-desc' : 'sort-asc';
                    }
                    return '';
                };
                
                stocksSection.innerHTML = `
                    <div style="margin-bottom: 15px; color: #d4af37; font-weight: 600;">
                        ${title} (${stocks.length})
                    </div>
                    <div class="stocks-header">
                        <div class="stock-header-item ${getSortClass('name')}" onclick="plateMonitor.sortStocks('name')">股票名称</div>
                        <div class="stock-header-item ${getSortClass('code')}" onclick="plateMonitor.sortStocks('code')">代码</div>
                        <div class="stock-header-item ${getSortClass('change_pct')}" onclick="plateMonitor.sortStocks('change_pct')">涨跌幅</div>
                        <div class="stock-header-item ${getSortClass('price')}" onclick="plateMonitor.sortStocks('price')">最新价</div>
                        <div class="stock-header-item ${getSortClass('volume')}" onclick="plateMonitor.sortStocks('volume')">成交额</div>
                        <div class="stock-header-item ${getSortClass('market_cap')}" onclick="plateMonitor.sortStocks('market_cap')">市值</div>
                    </div>
                    <div class="stocks-container"></div>
                `;
                
                const stocksContainer = stocksSection.querySelector('.stocks-container');
                this.setupVirtualScroll(stocksContainer, stocks);
            }
            
            // 其他方法保持不变...
            handlePlateInit(data) {
                if (data.data) {
                    if (data.data.all_plates) {
                        this.allPlates = data.data.all_plates;
                    }
                    
                    if (data.data.main_plates) {
                        this.mainPlates = data.data.main_plates;
                    }
                    
                    if (data.data.main_plates_metrics) {
                        this.mainPlates = data.data.main_plates_metrics;
                    }
                    
                    this.updateCurrentPlates();
                    this.renderPlatesTable();
                    this.updateStats();
                    
                    this.showMessage('数据加载完成');
                }
            }
            
            handlePlateUpdate(data) {
                if (data.data) {
                    this.updateCount++;
                    
                    if (data.data.all_plates) {
                        this.updatePlateData(this.allPlates, data.data.all_plates, '全部板块');
                    }
                    
                    if (data.data.main_plates) {
                        this.updatePlateData(this.mainPlates, data.data.main_plates, '主流板块');
                    }
                    
                    this.lastUpdateTime = data.timestamp;
                    this.updateStats();
                    
                    if (this.autoUpdate) {
                        this.updateCurrentPlates();
                        this.updatePlatesDisplay();
                    }
                }
            }

            handleSubPlates(data) {
                if (data.main_plate && data.data) {
                    this.subPlatesCache.set(data.main_plate, data.data);
                    
                    if (this.selectedPlate && this.selectedPlate.name === data.main_plate) {
                        this.renderSubPlatesAndStocks(data.data);
                    }
                }
            }
            // 新增方法：移除重复股票
            removeDuplicateStocks(stocks) {
                const stockMap = new Map();
                const uniqueStocks = [];
                
                stocks.forEach(stock => {
                    if (!stockMap.has(stock.code)) {
                        stockMap.set(stock.code, true);
                        uniqueStocks.push(stock);
                    } else {
                        console.warn(`移除重复股票: ${stock.code} - ${stock.name}`);
                    }
                });
                
                return uniqueStocks;
            }
            // 修复handlePlateStocks方法
            handlePlateStocks(data) {
                if (data.plate_id && data.data) {
                    this.pendingRequests.delete(`stocks_${data.plate_id}`);
                    
                    // 缓存前去重
                    const uniqueStocks = this.removeDuplicateStocks(data.data);
                    this.stocksCache.set(data.plate_id, uniqueStocks);
                    
                    if (this.selectedPlate && this.selectedPlate.id === data.plate_id) {
                        this.updateAllStocksTabCount(uniqueStocks.length);
                        
                        if (!this.selectedSubPlate) {
                            this.renderStocksWithVirtualScroll(uniqueStocks, `${this.selectedPlate.name} 全部个股`);
                            this.updateSelectedPlateInfo();
                        }
                    }
                    
                    if (this.selectedSubPlate && this.selectedSubPlate.id === data.plate_id) {
                        this.renderStocksWithVirtualScroll(uniqueStocks, `${this.selectedSubPlate.name} 成分股`);
                        this.updateSelectedPlateInfo();
                    }
                }
            }

            subscribeStocks(plateId) {
                this.currentSubscribedPlate = plateId;
                this.sendMessage({
                    type: 'subscribe_stocks',
                    plate_id: plateId,
                    action: 'subscribe'
                });
            }

            unsubscribeStocks(plateId) {
                this.sendMessage({
                    type: 'subscribe_stocks',
                    plate_id: plateId,
                    action: 'unsubscribe'
                });
                this.currentSubscribedPlate = null;
            }
            
            renderSubPlatesAndStocks(subPlates) {
                const container = this.domCache.plateDetails;
                if (!container) return;
                
                let mainPlateStocks = this.stocksCache.get(this.selectedPlate.id) || [];
                const sortedSubPlates = this.sortSubPlatesArray(subPlates);
                
                const htmlParts = [];
                htmlParts.push(`
                    <div class="breadcrumb">
                        <span class="breadcrumb-item" onclick="plateMonitor.backToMain()">全部板块</span>
                        <span class="breadcrumb-separator">></span>
                        <span class="breadcrumb-item">${this.selectedPlate.name}</span>
                    </div>
                    <div class="sub-plate-controls">
                        <div style="color: #d4af37; font-weight: 600;">
                            子板块筛选
                        </div>
                        <div class="sub-sort-controls">
                            <button class="control-btn small ${this.subPlateSort.field === 'change_pct' ? 'active' : ''}" onclick="plateMonitor.sortSubPlates('change_pct')">涨跌幅</button>
                            <button class="control-btn small ${this.subPlateSort.field === 'total_volume' ? 'active' : ''}" onclick="plateMonitor.sortSubPlates('total_volume')">成交额</button>
                        </div>
                    </div>
                    <div class="sub-plates-tabs" id="subPlatesTabs">
                        <div class="sub-plate-tab all-stocks-tab ${!this.selectedSubPlate ? 'selected' : ''}" 
                            onclick="plateMonitor.showAllStocks()">
                            <span class="sub-plate-tab-name">全部个股</span>
                            <span class="sub-plate-tab-change">${mainPlateStocks.length}只</span>
                        </div>
                `);
                
                sortedSubPlates.forEach((plate, index) => {
                    const changeClass = plate.change_pct >= 0 ? 'change-positive' : 'change-negative';
                    const changeSign = plate.change_pct >= 0 ? '+' : '';
                    const isSelected = this.selectedSubPlate && this.selectedSubPlate.id === plate.id;
                    
                    htmlParts.push(`
                        <div class="sub-plate-tab ${isSelected ? 'selected' : ''}" 
                             data-sub-plate-id="${plate.id}" 
                             onclick="plateMonitor.filterStocksBySubPlate(${JSON.stringify(plate).replace(/"/g, '&quot;')})">
                            <span class="sub-plate-tab-name">${plate.name}</span>
                            <span class="sub-plate-tab-change ${changeClass}">
                                ${changeSign}${(plate.change_pct * 100).toFixed(2)}%
                            </span>
                        </div>
                    `);
                });
                
                htmlParts.push('</div>');
                
                const stocksToShow = this.selectedSubPlate ? 
                    (this.stocksCache.get(this.selectedSubPlate.id) || []) : 
                    mainPlateStocks;
                
                const title = this.selectedSubPlate ? 
                    `${this.selectedSubPlate.name} 成分股` : 
                    `${this.selectedPlate.name} 全部个股`;
                
                // 使用虚拟滚动渲染股票
                htmlParts.push(`<div class="stocks-section"></div>`);
                container.innerHTML = htmlParts.join('');
                
                // 渲染股票部分
                if (stocksToShow.length > 0) {
                    this.renderStocksWithVirtualScroll(stocksToShow, title);
                } else {
                    container.querySelector('.stocks-section').innerHTML = `
                        <div style="margin-bottom: 15px; color: #d4af37; font-weight: 600;">
                            ${title} (0)
                        </div>
                        <div class="loading">正在加载个股数据...</div>
                    `;
                }
                
                this.cacheSubPlateElements();
                this.currentStocks = stocksToShow;
                this.updateSelectedPlateInfo();
            }

            showAllStocks() {
                if (this.selectedPlate && this.currentSubscribedPlate !== this.selectedPlate.id) {
                    if (this.currentSubscribedPlate) {
                        this.unsubscribeStocks(this.currentSubscribedPlate);
                    }
                    this.subscribeStocks(this.selectedPlate.id);
                }
                
                this.selectedSubPlate = null;
                
                document.querySelectorAll('.sub-plate-tab.selected').forEach(tab => {
                    tab.classList.remove('selected');
                });
                document.querySelector('.sub-plate-tab.all-stocks-tab').classList.add('selected');
                
                const mainPlateStocks = this.stocksCache.get(this.selectedPlate.id) || [];
                this.renderStocksWithVirtualScroll(mainPlateStocks, `${this.selectedPlate.name} 全部个股`);
                
                this.currentStocks = mainPlateStocks;
                this.updateSelectedPlateInfo();
                
                this.viewState.currentSubPlate = null;
                this.viewState.showStocks = true;
            }

            filterStocksBySubPlate(subPlate) {
                if (this.currentSubscribedPlate !== subPlate.id) {
                    if (this.currentSubscribedPlate) {
                        this.unsubscribeStocks(this.currentSubscribedPlate);
                    }
                    this.subscribeStocks(subPlate.id);
                }
                
                document.querySelectorAll('.sub-plate-tab.selected').forEach(tab => {
                    tab.classList.remove('selected');
                });
                
                const element = document.querySelector(`[data-sub-plate-id="${subPlate.id}"]`);
                if (element) {
                    element.classList.add('selected');
                }
                
                this.selectedSubPlate = subPlate;
                
                if (this.stocksCache.has(subPlate.id)) {
                    const stocks = this.stocksCache.get(subPlate.id);
                    this.renderStocksWithVirtualScroll(stocks, `${subPlate.name} 成分股`);
                    this.currentStocks = stocks;
                    this.updateSelectedPlateInfo();
                } else {
                    this.requestSubPlateStocks(subPlate.id);
                    const stocksSection = this.domCache.plateDetails.querySelector('.stocks-section');
                    if (stocksSection) {
                        stocksSection.innerHTML = `
                            <div style="margin-bottom: 15px; color: #d4af37; font-weight: 600;">
                                正在加载 ${subPlate.name} 成分股...
                            </div>
                            <div class="loading">正在加载个股数据...</div>
                        `;
                    }
                }
                
                this.viewState.currentSubPlate = subPlate;
                this.viewState.showStocks = true;
            }

            requestSubPlateStocks(plateId) {
                const key = `stocks_${plateId}`;
                const now = Date.now();
                
                if (this.pendingRequests.has(key)) {
                    const requestTime = this.pendingRequests.get(key);
                    if (now - requestTime < 10000) {
                        return;
                    }
                }
                
                this.pendingRequests.set(key, now);
                this.sendMessage({
                    type: 'get_plate_stocks',
                    plate_id: plateId,
                    is_sub_plate: true
                });
            }

            requestMainPlateStocks(plateId) {
                const key = `stocks_${plateId}`;
                const now = Date.now();
                
                if (this.pendingRequests.has(key)) {
                    const requestTime = this.pendingRequests.get(key);
                    if (now - requestTime < 10000) {
                        return;
                    }
                }
                
                this.pendingRequests.set(key, now);
                this.sendMessage({
                    type: 'get_plate_stocks',
                    plate_id: plateId,
                    is_main_plate: true
                });
            }
            
            getCurrentStockTitle() {
                if (this.selectedSubPlate) {
                    return `${this.selectedSubPlate.name} 成分股`;
                } else if (this.selectedPlate) {
                    return `${this.selectedPlate.name} 全部个股`;
                }
                return '个股列表';
            }
            
            // 其他方法保持不变...
            updatePlateData(existingPlates, newPlates, plateType) {
                const plateMap = new Map();
                
                existingPlates.forEach(plate => {
                    plateMap.set(plate.id, plate);
                });
                
                newPlates.forEach(newPlate => {
                    const existingPlate = plateMap.get(newPlate.id);
                    if (existingPlate) {
                        const hasChanged = this.checkPlateChanges(existingPlate, newPlate);
                        Object.assign(existingPlate, newPlate);
                    } else {
                        existingPlates.push(newPlate);
                        plateMap.set(newPlate.id, newPlate);
                    }
                });
                
                this.updateCurrentPlates();
            }
            
            checkPlateChanges(oldPlate, newPlate) {
                const fields = ['change_pct', 'total_volume', 'total_large_net', 'rise_count', 'fall_count'];
                return fields.some(field => {
                    const oldVal = oldPlate[field] || 0;
                    const newVal = newPlate[field] || 0;
                    return Math.abs(oldVal - newVal) > 0.0001;
                });
            }
            
            updateCurrentPlates() {
                this.currentPlates = this.currentPlateType === 'main' ? this.mainPlates : this.allPlates;
                this.sortCurrentPlates();
                this.updateDisplayedPlates();
            }
            
            sortCurrentPlates() {
                if (!this.currentPlates.length) return;
                
                const checksum = this.currentPlates
                    .map(p => p[this.currentSort.field] || 0)
                    .join(',');
                    
                if (checksum === this.lastSortChecksum) return;
                
                this.currentPlates.sort((a, b) => {
                    let aVal = a[this.currentSort.field] || 0;
                    let bVal = b[this.currentSort.field] || 0;
                    
                    if (this.currentSort.field === 'name') {
                        aVal = a.name || '';
                        bVal = b.name || '';
                        return this.currentSort.direction === 'desc' ? 
                            bVal.localeCompare(aVal) : aVal.localeCompare(bVal);
                    }
                    
                    if (this.currentSort.direction === 'desc') {
                        return bVal - aVal;
                    } else {
                        return aVal - bVal;
                    }
                });
                
                this.lastSortChecksum = checksum;
            }
            
            updateDisplayedPlates() {
                this.displayedPlates = this.currentPlates.slice(0, this.displayCount);
            }
            
            updatePlatesDisplay() {
                if (this.plateElements.size === 0) {
                    this.renderPlatesTable();
                    return;
                }
                
                this.displayedPlates.forEach(plate => {
                    const element = this.plateElements.get(plate.id);
                    if (element) {
                        this.updatePlateElement(element, plate);
                    }
                });
            }
            
            updatePlateElement(element, plate) {
                let hasChanged = false;
                const changeClass = plate.change_pct >= 0 ? 'change-positive' : 'change-negative';
                const changeSign = plate.change_pct >= 0 ? '+' : '';
                
                const changeElement = element.querySelector('.change-value');
                if (changeElement) {
                    const newValue = `${changeSign}${(plate.change_pct * 100).toFixed(2)}%`;
                    if (changeElement.textContent !== newValue) {
                        changeElement.textContent = newValue;
                        changeElement.className = `change-value ${changeClass}`;
                        changeElement.classList.add('value-updated');
                        setTimeout(() => changeElement.classList.remove('value-updated'), 1000);
                        hasChanged = true;
                    }
                }
                
                const volumeElement = element.querySelector('.volume-value');
                if (volumeElement) {
                    const newVolume = this.formatNumber(plate.total_volume);
                    if (volumeElement.textContent !== newVolume) {
                        volumeElement.textContent = newVolume;
                        volumeElement.classList.add('value-updated');
                        setTimeout(() => volumeElement.classList.remove('value-updated'), 1000);
                        hasChanged = true;
                    }
                }
                
                const netElement = element.querySelector('.net-value');
                if (netElement) {
                    const newNet = this.formatNumber(plate.total_large_net);
                    if (netElement.textContent !== newNet) {
                        netElement.textContent = newNet;
                        netElement.className = `net-value ${plate.total_large_net >= 0 ? 'change-positive' : 'change-negative'}`;
                        netElement.classList.add('value-updated');
                        setTimeout(() => netElement.classList.remove('value-updated'), 1000);
                        hasChanged = true;
                    }
                }
                
                const riseFallElement = element.querySelector('.rise-fall-value');
                if (riseFallElement) {
                    const newRiseFall = `<span class="change-positive">${plate.rise_count || 0}↑</span> / <span class="change-negative">${plate.fall_count || 0}↓</span>`;
                    if (riseFallElement.innerHTML !== newRiseFall) {
                        riseFallElement.innerHTML = newRiseFall;
                        hasChanged = true;
                    }
                }
                
                const stockElement = element.querySelector('.stock-value');
                if (stockElement) {
                    const newStockCount = plate.stock_count || 0;
                    if (stockElement.textContent !== newStockCount.toString()) {
                        stockElement.textContent = newStockCount;
                        hasChanged = true;
                    }
                }
            }
            
            renderPlatesTable() {
                const container = this.domCache.platesContainer;
                this.plateElements.clear();
                
                if (this.displayedPlates.length === 0) {
                    container.innerHTML = '<div class="loading">正在加载板块数据...</div>';
                    return;
                }
                
                const htmlParts = [];
                htmlParts.push(`
                    <div class="plates-flex-container">
                        <div class="plate-header">
                            <div class="plate-header-item ${this.getSortClass('name')}" onclick="plateMonitor.sortPlates('name')">板块名称</div>
                            <div class="plate-header-item ${this.getSortClass('change_pct')}" onclick="plateMonitor.sortPlates('change_pct')">涨跌幅</div>
                            <div class="plate-header-item ${this.getSortClass('total_volume')}" onclick="plateMonitor.sortPlates('total_volume')">成交额</div>
                            <div class="plate-header-item ${this.getSortClass('total_large_net')}" onclick="plateMonitor.sortPlates('total_large_net')">主力净额</div>
                            <div class="plate-header-item ${this.getSortClass('rise_count')}" onclick="plateMonitor.sortPlates('rise_count')">涨/跌</div>
                            <div class="plate-header-item ${this.getSortClass('stock_count')}" onclick="plateMonitor.sortPlates('stock_count')">成分股</div>
                        </div>
                `);
                
                this.displayedPlates.forEach((plate, index) => {
                    const changeClass = plate.change_pct >= 0 ? 'change-positive' : 'change-negative';
                    const changeSign = plate.change_pct >= 0 ? '+' : '';
                    const turnover = this.formatNumber(plate.total_volume);
                    const mainNet = this.formatNumber(plate.total_large_net);
                    const isSelected = this.selectedPlate && this.selectedPlate.id === plate.id;
                    const rowClass = isSelected ? 'plate-row plate-selected' : 'plate-row';
                    
                    htmlParts.push(`
                        <div class="${rowClass}" data-plate-id="${plate.id}" onclick="plateMonitor.selectPlate(${JSON.stringify(plate).replace(/"/g, '&quot;')})">
                            <div>
                                <span class="plate-name">${plate.name}</span>
                            </div>
                            <div>
                                <span class="change-value ${changeClass}">${changeSign}${(plate.change_pct * 100).toFixed(2)}%</span>
                            </div>
                            <div><span class="volume-value">${turnover}</span></div>
                            <div>
                                <span class="net-value ${plate.total_large_net >= 0 ? 'change-positive' : 'change-negative'}">${mainNet}</span>
                            </div>
                            <div>
                                <span class="rise-fall-value">
                                    <span class="change-positive">${plate.rise_count || 0}↑</span> / 
                                    <span class="change-negative">${plate.fall_count || 0}↓</span>
                                </span>
                            </div>
                            <div><span class="stock-value">${plate.stock_count || 0}</span></div>
                        </div>
                    `);
                });
                
                htmlParts.push('</div>');
                container.innerHTML = htmlParts.join('');
                
                this.displayedPlates.forEach(plate => {
                    const element = container.querySelector(`[data-plate-id="${plate.id}"]`);
                    if (element) {
                        this.plateElements.set(plate.id, element);
                    }
                });
                
                this.updateHeaderSortClasses();
            }
            
            selectPlate(plate) {
                document.querySelectorAll('.plate-selected').forEach(el => {
                    el.classList.remove('plate-selected');
                });
                
                const element = document.querySelector(`[data-plate-id="${plate.id}"]`);
                if (element) {
                    element.classList.add('plate-selected');
                }
                
                this.selectedPlate = plate;
                this.selectedSubPlate = null;
                this.currentStocks = [];
                
                this.viewState.currentMainPlate = plate;
                this.viewState.currentSubPlate = null;
                this.viewState.showStocks = false;
                
                this.subscribeStocks(plate.id);
                
                this.loadSubPlates(plate.name);
                this.requestMainPlateStocks(plate.id);
            }
            
            loadSubPlates(plateName) {
                this.selectedPlate = this.allPlates.find(p => p.name === plateName) || this.mainPlates.find(p => p.name === plateName);
                if (!this.selectedPlate) return;
                
                document.getElementById('detailTitle').textContent = `📈 ${plateName}`;
                
                if (this.subPlatesCache.has(plateName)) {
                    if (this.stocksCache.has(this.selectedPlate.id)) {
                        this.renderSubPlatesAndStocks(this.subPlatesCache.get(plateName));
                    }
                } else {
                    this.sendMessage({
                        type: 'get_sub_plates',
                        main_plate: plateName
                    });
                    
                    this.domCache.plateDetails.innerHTML = '<div class="loading">正在加载子板块数据...</div>';
                }
            }
            
            cacheSubPlateElements() {
                this.subPlateElements.clear();
                const elements = document.querySelectorAll('[data-sub-plate-id]');
                elements.forEach(element => {
                    const plateId = element.getAttribute('data-sub-plate-id');
                    this.subPlateElements.set(plateId, element);
                });
            }

            sortSubPlates(field) {
                if (this.subPlateSort.field === field) {
                    this.subPlateSort.direction = this.subPlateSort.direction === 'desc' ? 'asc' : 'desc';
                } else {
                    this.subPlateSort.field = field;
                    this.subPlateSort.direction = 'desc';
                }
                
                this.applySubPlateSort();
                this.updateSubPlateSortButtons();
            }

            sortSubPlatesArray(plates) {
                return [...plates].sort((a, b) => {
                    let aVal = a[this.subPlateSort.field] || 0;
                    let bVal = b[this.subPlateSort.field] || 0;
                    
                    if (this.subPlateSort.direction === 'desc') {
                        return bVal - aVal;
                    } else {
                        return aVal - bVal;
                    }
                });
            }

            applySubPlateSort() {
                if (!this.selectedPlate) return;
                
                const cachedSubPlates = this.subPlatesCache.get(this.selectedPlate.name);
                if (cachedSubPlates) {
                    this.renderSubPlatesAndStocks(cachedSubPlates);
                }
            }

            updateSubPlateSortButtons() {
                const buttons = document.querySelectorAll('.sub-sort-controls .control-btn.small');
                buttons.forEach(btn => {
                    btn.classList.remove('active');
                });
                
                const activeBtn = document.querySelector(`.sub-sort-controls .control-btn.small[onclick*="${this.subPlateSort.field}"]`);
                if (activeBtn) {
                    activeBtn.classList.add('active');
                }
            }
            
            backToMain() {
                if (this.currentSubscribedPlate) {
                    this.unsubscribeStocks(this.currentSubscribedPlate);
                }
                
                this.viewState.currentMainPlate = null;
                this.viewState.currentSubPlate = null;
                this.viewState.showStocks = false;
                this.domCache.plateDetails.innerHTML = '<div class="no-data">请从左侧板块列表中选择一个板块查看其详细信息</div>';
                document.getElementById('detailTitle').textContent = '📈 板块详情';
                document.getElementById('selectedPlateInfo').textContent = '请选择板块查看详情';
            }
            
            sortPlates(field, direction = null) {
                if (this.currentSort.field === field) {
                    this.currentSort.direction = this.currentSort.direction === 'desc' ? 'asc' : 'desc';
                } else {
                    this.currentSort.field = field;
                    this.currentSort.direction = direction || 'desc';
                }
                
                this.updateCurrentPlates();
                this.renderPlatesTable();
                this.updateSortInfo();
            }
            
            getSortClass(field) {
                if (this.currentSort.field === field) {
                    return this.stockSort.direction === 'desc' ? 'sort-desc' : 'sort-asc';
                }
                return '';
            }
            
            updateHeaderSortClasses() {
                const headerItems = document.querySelectorAll('.plate-header-item');
                headerItems.forEach(item => {
                    item.classList.remove('sort-asc', 'sort-desc');
                });
                
                const currentHeader = document.querySelector(`.plate-header-item[onclick*="${this.currentSort.field}"]`);
                if (currentHeader) {
                    currentHeader.classList.add(this.currentSort.direction === 'desc' ? 'sort-desc' : 'sort-asc');
                }
            }
            
            togglePlateType() {
                this.currentPlateType = this.currentPlateType === 'main' ? 'all' : 'main';
                this.updateCurrentPlates();
                this.renderPlatesTable();
                this.updatePlateTypeButton();
            }
            
            updateStats() {
                this.stats.total = this.currentPlates.length;
                this.stats.rise = this.currentPlates.filter(p => p.change_pct > 0).length;
                this.stats.fall = this.currentPlates.filter(p => p.change_pct < 0).length;
                
                const totalStocks = this.stats.rise + this.stats.fall;
                const marketRiseRate = totalStocks > 0 ? (this.stats.rise / totalStocks * 100).toFixed(1) : 0;
                
                const totalVolume = this.currentPlates.reduce((sum, plate) => sum + (plate.total_volume || 0), 0);
                
                document.getElementById('totalPlates').textContent = this.stats.total;
                document.getElementById('risePlates').textContent = this.stats.rise;
                document.getElementById('fallPlates').textContent = this.stats.fall;
                document.getElementById('marketRiseRate').textContent = `${marketRiseRate}%`;
                document.getElementById('totalVolume').textContent = this.formatNumber(totalVolume);
                document.getElementById('updateTime').textContent = new Date().toLocaleTimeString();
            }
            
            updateSelectedPlateInfo() {
                const infoElement = document.getElementById('selectedPlateInfo');
                if (this.selectedSubPlate) {
                    const changePct = (this.selectedSubPlate.change_pct * 100).toFixed(2);
                    const changeSign = this.selectedSubPlate.change_pct >= 0 ? '+' : '';
                    infoElement.textContent = `${this.selectedPlate.name} > ${this.selectedSubPlate.name} ${changeSign}${changePct}% | ${this.currentStocks.length}只个股`;
                } else if (this.selectedPlate) {
                    const changePct = (this.selectedPlate.change_pct * 100).toFixed(2);
                    const changeSign = this.selectedPlate.change_pct >= 0 ? '+' : '';
                    infoElement.textContent = `${this.selectedPlate.name} ${changeSign}${changePct}% | ${this.currentStocks.length}只个股`;
                } else {
                    infoElement.textContent = '请选择板块';
                }
            }
            
            updateSortInfo() {
                const fieldNames = {
                    'change_pct': '涨跌幅',
                    'total_volume': '成交额', 
                    'total_large_net': '主力净额',
                    'rise_count': '上涨家数',
                    'name': '名称'
                };
                
                const direction = this.currentSort.direction === 'desc' ? '降序' : '升序';
                document.getElementById('sortInfo').textContent = 
                    `按${fieldNames[this.currentSort.field]}${direction}排序`;
            }
            
            updatePlateTypeButton() {
                const btn = document.getElementById('plateTypeBtn');
                btn.textContent = this.currentPlateType === 'main' ? '主流板块' : '全部板块';
                btn.classList.toggle('active', this.currentPlateType === 'main');
                document.getElementById('leftTitle').textContent = 
                    this.currentPlateType === 'main' ? '🏆 主流板块排行' : '📊 全部板块排行';
            }
            
            updateConnectionStatus(connected) {
                const statusElement = this.domCache.connectionStatus;
                if (connected) {
                    statusElement.innerHTML = '<span class="status-icon">✅</span> 已连接';
                    statusElement.className = 'connection-status status-connected';
                } else {
                    statusElement.innerHTML = '<span class="status-icon">❌</span> 断开连接';
                    statusElement.className = 'connection-status status-disconnected';
                }
            }
            
            showRealTimeBadge() {
                this.domCache.realTimeBadge.style.display = 'inline';
            }
            
            hideRealTimeBadge() {
                this.domCache.realTimeBadge.style.display = 'none';
            }
            
            formatNumber(num) {
                if (num === undefined || num === null) return '0';
                
                const absNum = Math.abs(num);
                if (absNum >= 100000000) {
                    return (num / 100000000).toFixed(2) + '万亿';
                } else if (absNum >= 10000) {
                    return (num / 10000).toFixed(0) + '亿';
                }
                return num.toString()+'万';
            }
            
            // 修复3: 刷新数据功能
            refreshData() {
                if (this.ws) {
                    this.ws.close();
                }
                this.connect();
                this.showMessage('正在刷新数据...');
            }
            
            sendMessage(message) {
                if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                    this.ws.send(JSON.stringify(message));
                } else {
                    this.showMessage('连接未就绪，请等待重连...');
                }
            }
            
            showMessage(message) {
                console.log('系统消息:', message);
            }
            
            setupEventListeners() {
                this.domCache.connectionStatus.addEventListener('click', () => {
                    this.connect();
                });
            }
            
            setupScrollLoading() {
                const container = this.domCache.platesContainer;
                container.addEventListener('scroll', () => {
                    const { scrollTop, scrollHeight, clientHeight } = container;
                    if (scrollTop + clientHeight >= scrollHeight - 50) {
                        this.loadMorePlates();
                    }
                });
            }
            
            loadMorePlates() {
                if (this.isLoading || this.displayCount >= this.currentPlates.length) return;
                
                this.isLoading = true;
                this.displayCount += 20;
                this.updateDisplayedPlates();
                this.renderPlatesTable();
                this.isLoading = false;
            }
            
            updateAllStocksTabCount(count) {
                const allStocksTab = document.querySelector('.sub-plate-tab.all-stocks-tab');
                if (allStocksTab) {
                    const countElement = allStocksTab.querySelector('.sub-plate-tab-change');
                    if (countElement) {
                        countElement.textContent = `${count}只`;
                    }
                }
            }
            
            handleSubscribeResult(data) {
                if (data.action === 'subscribed') {
                    this.showMessage(`✅ 已开启 ${data.plate_id} 个股实时更新`);
                } else {
                    this.showMessage(`❌ 已关闭 ${data.plate_id} 个股实时更新`);
                }
            }
        }
        
        const plateMonitor = new PlateMonitor();
        
        document.addEventListener('DOMContentLoaded', function() {
            plateMonitor.init();
        });
    </script>
</body>
</html>
