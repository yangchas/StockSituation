            }
            
            updateSelectedPlateInfo() {
                const infoElement = document.getElementById('selectedPlateInfo');
                if (this.selectedSubPlate) {
                    const changePct = (this.selectedSubPlate.change_pct * 100).toFixed(2);
                    const changeSign = this.selectedSubPlate.change_pct >= 0 ? '+' : '';
                    infoElement.textContent = `${this.selectedPlate.name} > ${this.selectedSubPlate.name} ${changeSign}${changePct}% | ${this.currentStocks.length}只个股`;
                } else if (this.selectedPlate) {
                    const changePct = (this.selectedPlate.change_pct * 100).toFixed(2);
                    const changeSign = this.selectedPlate.change_pct >= 0 ? '+' : '';
                    infoElement.textContent = `${this.selectedPlate.name} ${changeSign}${changePct}% | ${this.currentStocks.length}只个股`;
                } else {
                    infoElement.textContent = '请选择板块';
                }
            }
            
            updateSortInfo() {
                const fieldNames = {
                    'change_pct': '涨跌幅',
                    'total_volume': '成交额', 
                    'total_large_net': '主力净额',
                    'rise_count': '上涨家数',
                    'name': '名称'
                };
                
                const direction = this.currentSort.direction === 'desc' ? '降序' : '升序';
                document.getElementById('sortInfo').textContent = 
                    `按${fieldNames[this.currentSort.field]}${direction}排序`;
            }
            
            updatePlateTypeButton() {
                const btn = document.getElementById('plateTypeBtn');
                btn.textContent = this.currentPlateType === 'main' ? '主流板块' : '全部板块';
                btn.classList.toggle('active', this.currentPlateType === 'main');
                document.getElementById('leftTitle').textContent = 
                    this.currentPlateType === 'main' ? '🏆 主流板块排行' : '📊 全部板块排行';
            }
            
            updateConnectionStatus(connected) {
                const statusElement = this.domCache.connectionStatus;
                if (connected) {
                    statusElement.innerHTML = '<span class="status-icon">✅</span> 已连接';
                    statusElement.className = 'connection-status status-connected';
                } else {
                    statusElement.innerHTML = '<span class="status-icon">❌</span> 断开连接';
                    statusElement.className = 'connection-status status-disconnected';
                }
            }
            
            showRealTimeBadge() {
                this.domCache.realTimeBadge.style.display = 'inline';
            }
            
            hideRealTimeBadge() {
                this.domCache.realTimeBadge.style.display = 'none';
            }
            
            formatNumber(num) {
                if (num === undefined || num === null) return '0';
                
                const absNum = Math.abs(num);
                if (absNum >= 100000000) {
                    return (num / 100000000).toFixed(2) + '万亿';
                } else if (absNum >= 10000) {
                    return (num / 10000).toFixed(0) + '亿';
                }
                return num.toString()+'万';
            }
            
            // 修复3: 刷新数据功能
            refreshData() {
                if (this.ws) {
                    this.ws.close();
                }
                this.connect();
                this.showMessage('正在刷新数据...');
            }
            
            sendMessage(message) {
                if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                    this.ws.send(JSON.stringify(message));
                } else {
                    this.showMessage('连接未就绪，请等待重连...');
                }
            }
            
            showMessage(message) {
                console.log('系统消息:', message);
            }
            
            setupEventListeners() {
                this.domCache.connectionStatus.addEventListener('click', () => {
                    this.connect();
                });
            }
            
            setupScrollLoading() {
                const container = this.domCache.platesContainer;
                container.addEventListener('scroll', () => {
                    const { scrollTop, scrollHeight, clientHeight } = container;
                    if (scrollTop + clientHeight >= scrollHeight - 50) {
                        this.loadMorePlates();
                    }
                });
            }
            
            loadMorePlates() {
                if (this.isLoading || this.displayCount >= this.currentPlates.length) return;
                
                this.isLoading = true;
                this.displayCount += 20;
                this.updateDisplayedPlates();
                this.renderPlatesTable();
                this.isLoading = false;
            }
            
            updateAllStocksTabCount(count) {
                const allStocksTab = document.querySelector('.sub-plate-tab.all-stocks-tab');
                if (allStocksTab) {
                    const countElement = allStocksTab.querySelector('.sub-plate-tab-change');
                    if (countElement) {
                        countElement.textContent = `${count}只`;
                    }
                }
            }
            
            handleSubscribeResult(data) {
                if (data.action === 'subscribed') {
                    this.showMessage(`✅ 已开启 ${data.plate_id} 个股实时更新`);
                } else {
                    this.showMessage(`❌ 已关闭 ${data.plate_id} 个股实时更新`);
                }
            }
        }
        
        const plateMonitor = new PlateMonitor();
        
        document.addEventListener('DOMContentLoaded', function() {
            plateMonitor.init();
        });
    </script>
</body>
</html>
