<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时板块监控系统</title>
    <style>
        /* 所有样式保持不变 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 100%);
            color: #e0e0e0;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            background: rgba(26, 26, 46, 0.8);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            border: 1px solid #333;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }
        
        .header h1 {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 28px;
            margin-bottom: 15px;
            color: #fff;
        }
        
        .connection-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .status-connected {
            background: linear-gradient(135deg, #00c853, #64dd17);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 200, 83, 0.3);
        }
        
        .status-disconnected {
            background: linear-gradient(135deg, #ff1744, #f50057);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 23, 68, 0.3);
        }
        
        .real-time-badge {
            background: linear-gradient(135deg, #ffab00, #ff6d00);
            color: #000;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            animation: pulse 2s infinite;
            box-shadow: 0 4px 15px rgba(255, 171, 0, 0.3);
        }
        
        .control-panel {
            display: flex;
            gap: 12px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        
        .control-btn {
            padding: 10px 18px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .control-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .control-btn.active {
            background: linear-gradient(135deg, #d4af37, #f7ef8a);
            color: #000;
            border-color: #d4af37;
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
        }
        
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin: 20px 0;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .stat-item {
            text-align: center;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            transition: all 0.3s;
        }
        
        .stat-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 14px;
            color: #aaa;
        }
        
        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            height: 70vh;
        }
        
        .section {
            background: rgba(26, 26, 46, 0.8);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid #333;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
        }
        
        .section-header h2 {
            font-size: 20px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .plates-container {
            flex: 1;
            overflow-y: auto;
            position: relative;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.2);
        }
        
        .plates-flex-container {
            display: flex;
            flex-direction: column;
            min-height: 100%;
        }
        
        .plate-header {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr 1fr 0.8fr;
            gap: 10px;
            padding: 15px 12px;
            background: rgba(40, 40, 60, 0.8);
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 10;
            font-weight: 600;
        }
        
        .plate-header-item {
            cursor: pointer;
            user-select: none;
            transition: all 0.3s;
            padding: 5px;
            border-radius: 4px;
        }
        
        .plate-header-item:hover {
            background: rgba(50, 50, 70, 0.9);
        }
        
        .plate-header-item.sort-asc::after {
            content: " ↑";
            color: #d4af37;
        }
        
        .plate-header-item.sort-desc::after {
            content: " ↓";
            color: #d4af37;
        }
        
        .plate-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr 1fr 0.8fr;
            gap: 10px;
            padding: 14px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s;
            align-items: center;
        }
        
        .plate-row:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        
        .plate-row.plate-selected {
            background: rgba(41, 98, 255, 0.2);
            border-left: 4px solid #d4af37;
        }
        
        .change-positive {
            color: #ff5252;
            font-weight: 600;
        }
        
        .change-negative {
            color: #4caf50;
            font-weight: 600;
        }
        
        .plate-name {
            font-weight: bold;
            color: #d4af37;
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .plate-name:hover {
            color: #f7ef8a;
        }
        
        .value-updated {
            animation: valueUpdate 1s ease;
        }
        
        @keyframes valueUpdate {
            0% { background: rgba(76, 175, 80, 0.3); }
            100% { background: transparent; }
        }
        
        .sub-plates-container {
            flex: 1;
            overflow-y: auto;
            padding: 5px;
        }
        
        .sub-plates-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
            padding: 10px;
            background: rgba(40, 40, 60, 0.6);
            border-radius: 8px;
        }
        
        .sub-plate-tab {
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 13px;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .sub-plate-tab:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }
        
        .sub-plate-tab.selected {
            background: linear-gradient(135deg, #d4af37, #f7ef8a);
            color: #000;
            border-color: #d4af37;
            box-shadow: 0 3px 10px rgba(212, 175, 55, 0.3);
        }
        
        .sub-plate-tab-name {
            font-weight: 500;
        }
        
        .sub-plate-tab-change {
            font-weight: 600;
            font-size: 12px;
        }
        
        .all-stocks-tab {
            background: rgba(41, 98, 255, 0.3);
            border-color: rgba(41, 98, 255, 0.5);
        }
        
        .all-stocks-tab.selected {
            background: linear-gradient(135deg, #2962ff, #448aff);
            color: white;
        }
        
        .sub-plate-controls {
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .sub-sort-controls {
            display: flex;
            gap: 10px;
        }
        
        .control-btn.small {
            padding: 6px 12px;
            font-size: 12px;
            background: rgba(255, 255, 255, 0.05);
        }
        
        .control-btn.small.active {
            background: linear-gradient(135deg, #d4af37, #f7ef8a);
            color: #000;
        }
        
        .stocks-section {
            margin-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 20px;
        }
        
        .stocks-header {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr 1fr 1fr;
            gap: 10px;
            padding: 12px;
            background: rgba(40, 40, 60, 0.6);
            border-radius: 8px;
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .stock-header-item {
            cursor: pointer;
            user-select: none;
            transition: all 0.3s;
            padding: 5px;
            border-radius: 4px;
        }
        
        .stock-header-item:hover {
            background: rgba(50, 50, 70, 0.9);
        }
        
        .stock-header-item.sort-asc::after {
            content: " ↑";
            color: #d4af37;
        }
        
        .stock-header-item.sort-desc::after {
            content: " ↓";
            color: #d4af37;
        }
        
        .stock-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr 1fr 1fr;
            gap: 10px;
            padding: 10px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s;
            align-items: center;
        }
        
        .stock-row:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        
        .stock-name {
            font-weight: 500;
            color: #e0e0e0;
        }
        
        .stock-code {
            font-size: 12px;
            color: #aaa;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 16px;
        }
        
        .no-data {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 16px;
        }
        
        .refresh-btn {
            background: linear-gradient(135deg, #d4af37, #f7ef8a);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
        }
        
        .loading-more {
            text-align: center;
            padding: 15px;
            color: #666;
            font-size: 14px;
        }
        
        .update-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #d4af37, #f7ef8a);
            color: #000;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            z-index: 1000;
            animation: slideIn 0.5s ease;
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        
        .breadcrumb-item {
            color: #d4af37;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .breadcrumb-item:hover {
            color: #f7ef8a;
            text-decoration: underline;
        }
        
        .breadcrumb-separator {
            color: #666;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }
        
        @keyframes slideIn {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: rgba(212, 175, 55, 0.5);
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(212, 175, 55, 0.7);
        }
        
        @media (max-width: 1200px) {
            .content {
                grid-template-columns: 1fr;
                height: auto;
            }
            
            .section {
                min-height: 500px;
            }
        }
        
        @media (max-width: 768px) {
            .control-panel {
                justify-content: center;
            }
            
            .stats-bar {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .sub-plates-grid {
                grid-template-columns: 1fr;
            }
            
            .plate-header,
            .plate-row {
                grid-template-columns: 1.5fr 1fr 1fr 1fr;
                gap: 8px;
            }
            
            .plate-header-item:nth-child(5),
            .plate-row > div:nth-child(5),
            .plate-header-item:nth-child(6),
            .plate-row > div:nth-child(6) {
                display: none;
            }
            
            .stocks-header,
            .stock-row {
                grid-template-columns: 1.5fr 1fr 1fr 1fr;
                gap: 8px;
            }
            
            .stock-header-item:nth-child(2),
            .stock-row > div:nth-child(2),
            .stock-header-item:nth-child(6),
            .stock-row > div:nth-child(6) {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>
                📊 板块实时监控系统 
                <span id="connectionStatus" class="connection-status status-disconnected">
                    <span class="status-icon">❌</span> 断开连接
                </span>
                <span id="realTimeBadge" class="real-time-badge" style="display: none;">实时更新中</span>
            </h1>
            
            <div class="control-panel">
                <button class="control-btn" onclick="plateMonitor.togglePlateType()" id="plateTypeBtn">
                    <span>🏆</span> 主流板块
                </button>
                <button class="control-btn active" onclick="plateMonitor.toggleAutoUpdate()" id="autoUpdateBtn">
                    <span>🔄</span> 自动更新:开
                </button>
                <button class="refresh-btn" onclick="plateMonitor.refreshData()">
                    <span>🔄</span> 刷新数据
                </button>
            </div>
            
            <div class="stats-bar">
                <div class="stat-item">
                    <div class="stat-value" id="totalPlates">0</div>
                    <div class="stat-label">总板块数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value change-positive" id="risePlates">0</div>
                    <div class="stat-label">上涨板块</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value change-negative" id="fallPlates">0</div>
                    <div class="stat-label">下跌板块</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="marketRiseRate">--%</div>
                    <div class="stat-label">市场上涨率</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="totalVolume">--</div>
                    <div class="stat-label">总成交额</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="updateTime">--:--:--</div>
                    <div class="stat-label">最后更新</div>
                </div>
            </div>
        </div>
        
        <div class="content">
            <div class="section">
                <div class="section-header">
                    <h2 id="leftTitle">🏆 板块排行</h2>
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <span id="sortInfo" style="font-size: 14px; color: #aaa;">按涨跌幅排序</span>
                        <button class="refresh-btn" onclick="plateMonitor.refreshData()">
                            <span>🔄</span> 刷新数据
                        </button>
                    </div>
                </div>
                <div class="plates-container" id="platesContainer">
                    <div class="loading">正在连接服务器，加载板块数据...</div>
                </div>
            </div>
            
            <div class="section">
                <div class="section-header">
                    <h2 id="detailTitle">📈 板块详情</h2>
                    <span id="selectedPlateInfo" style="font-size: 14px; color: #aaa;">请选择板块查看详情</span>
                </div>
                <div class="sub-plates-container" id="plateDetails">
                    <div class="no-data">请从左侧板块列表中选择一个板块查看其详细信息</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        class PlateMonitor {
            constructor() {
                this.ws = null;
                this.allPlates = [];
                this.mainPlates = [];
                this.displayedPlates = [];
                this.currentPlates = [];
                this.currentSort = { field: 'change_pct', direction: 'desc' };
                this.currentPlateType = 'main';
                this.selectedPlate = null;
                this.selectedSubPlate = null;
                this.currentStocks = [];
                this.autoUpdate = true;
                this.displayCount = 30;
                this.isLoading = false;
                this.lastUpdateTime = 0;
                this.updateCount = 0;
                this.dataUpdateInterval = null;
                this.plateElements = new Map();
                this.stockElements = new Map();
                
                // 子板块DOM管理和排序
                this.subPlateElements = new Map();
                this.subPlateSort = { field: 'change_pct', direction: 'desc' };
                
                // 子板块和股票数据缓存
                this.subPlatesCache = new Map();
                this.stocksCache = new Map();
                this.subPlateStocksCache = new Map();
                
                // 新增：个股排序字段
                this.stockSort = { field: 'change_pct', direction: 'desc' };
                
                this.stats = {
                    total: 0,
                    rise: 0,
                    fall: 0
                };

                this.viewState = {
                    currentMainPlate: null,
                    currentSubPlate: null,
                    showStocks: false
                };
                
                // 新增：防止重复请求的标记
                this.pendingRequests = new Set();
            }
            
            init() {
                this.connect();
                this.setupEventListeners();
                this.setupScrollLoading();
            }
            
            connect() {
                try {
                    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                    const host = window.location.host;
                    const wsUrl = `${protocol}//${host}/ws/plate`;
                    
                    this.ws = new WebSocket(wsUrl);
                    
                    this.ws.onopen = () => {
                        console.log('✅ 板块WebSocket连接成功');
                        this.updateConnectionStatus(true);
                        this.showMessage('连接成功，正在加载数据...');
                    };
                    
                    this.ws.onmessage = (event) => {
                        try {
                            const data = JSON.parse(event.data);
                            this.handleWebSocketMessage(data);
                        } catch (error) {
                            console.error('解析WebSocket消息失败:', error, event.data);
                        }
                    };
                    
                    this.ws.onerror = (error) => {
                        console.error('WebSocket连接错误:', error);
                        this.updateConnectionStatus(false);
                        this.showMessage('连接错误，正在尝试重连...');
                    };
                    
                    this.ws.onclose = () => {
                        console.log('WebSocket连接关闭');
                        this.updateConnectionStatus(false);
                        setTimeout(() => this.connect(), 5000);
                    };
                    
                } catch (error) {
                    console.error('连接失败:', error);
                    setTimeout(() => this.connect(), 5000);
                }
            }
            
            handleWebSocketMessage(data) {
                console.log('📡 收到WebSocket消息:', data.type, data);
                
                if (data.type === 'plate_init') {
                    this.handlePlateInit(data);
                } else if (data.type === 'plate_update') {
                    this.handlePlateUpdate(data);
                } else if (data.type === 'sub_plates') {
                    this.handleSubPlates(data);
                } else if (data.type === 'plate_stocks') {
                    this.handlePlateStocks(data);
                } else if (data.type === 'error') {
                    console.error('服务器返回错误:', data.message);
                    this.showMessage(`服务器错误: ${data.message}`);
                }
            }
            
            handlePlateInit(data) {
                console.log('📊 处理初始化数据');
                
                if (data.data) {
                    if (data.data.all_plates) {
                        this.allPlates = data.data.all_plates;
                        console.log(`📈 加载所有板块: ${this.allPlates.length}个`);
                    }
                    
                    if (data.data.main_plates) {
                        this.mainPlates = data.data.main_plates;
                        console.log(`🏆 加载主流板块: ${this.mainPlates.length}个`);
                    }
                    
                    if (data.data.main_plates_metrics) {
                        this.mainPlates = data.data.main_plates_metrics;
                    }
                    
                    this.updateCurrentPlates();
                    this.renderPlatesTable();
                    this.updateStats();
                    
                    this.showMessage('数据加载完成');
                }
            }
            
            handlePlateUpdate(data) {
                console.log('🔄 处理实时更新数据');
                
                if (data.data) {
                    this.updateCount++;
                    
                    if (data.data.all_plates) {
                        this.updatePlateData(this.allPlates, data.data.all_plates, '全部板块');
                    }
                    
                    if (data.data.main_plates) {
                        this.updatePlateData(this.mainPlates, data.data.main_plates, '主流板块');
                    }
                    
                    this.lastUpdateTime = data.timestamp;
                    this.updateStats();
                    
                    if (this.autoUpdate) {
                        this.showRealTimeUpdate();
                        this.updateCurrentPlates();
                        this.updatePlatesDisplay();
                        
                        // 修复：在实时更新时保持子板块选中状态
                        if (this.selectedSubPlate) {
                            // 如果当前有选中的子板块，重新筛选股票
                            this.refreshSelectedSubPlate();
                        } else if (this.selectedPlate) {
                            // 如果当前有选中的主板块，刷新显示
                            this.refreshSelectedMainPlate();
                        }
                    }
                }
            }

            // 新增：刷新选中的子板块
            refreshSelectedSubPlate() {
                if (!this.selectedSubPlate) return;
                
                // 更新子板块数据
                const updatedSubPlate = this.allPlates.find(p => p.id === this.selectedSubPlate.id) || 
                                    this.mainPlates.find(p => p.id === this.selectedSubPlate.id);
                
                if (updatedSubPlate) {
                    this.selectedSubPlate = updatedSubPlate;
                    
                    // 如果有缓存的股票数据，直接更新显示
                    if (this.stocksCache.has(this.selectedSubPlate.id)) {
                        const stocks = this.stocksCache.get(this.selectedSubPlate.id);
                        console.log(`🔄 刷新子板块股票显示: ${this.selectedSubPlate.name}, ${stocks.length}只`);
                        this.updateStocksDisplay(stocks, `${this.selectedSubPlate.name} 成分股`);
                        this.currentStocks = stocks;
                        this.updateSelectedPlateInfo();
                    } else {
                        // 重新请求股票数据
                        console.log(`🔄 重新请求子板块股票: ${this.selectedSubPlate.id}`);
                        this.requestSubPlateStocks(this.selectedSubPlate.id);
                    }
                    
                    // 更新子板块选项卡显示
                    this.updateSubPlatesTabs();
                }
            }

            // 新增：刷新选中的主板块
            refreshSelectedMainPlate() {
                if (!this.selectedPlate) return;
                
                // 更新主板块数据
                const updatedPlate = this.allPlates.find(p => p.id === this.selectedPlate.id) || 
                                   this.mainPlates.find(p => p.id === this.selectedPlate.id);
                
                if (updatedPlate) {
                    this.selectedPlate = updatedPlate;
                    
                    // 如果有缓存的股票数据，直接更新显示
                    if (this.stocksCache.has(this.selectedPlate.id)) {
                        const stocks = this.stocksCache.get(this.selectedPlate.id);
                        this.updateStocksDisplay(stocks, `${this.selectedPlate.name} 全部个股`);
                        this.currentStocks = stocks;
                        this.updateSelectedPlateInfo();
                    } else {
                        // 重新请求股票数据
                        this.requestMainPlateStocks(this.selectedPlate.id);
                    }
                    
                    // 更新子板块选项卡显示
                    this.updateSubPlatesTabs();
                }
            }

            // 新增：更新子板块选项卡显示
            updateSubPlatesTabs() {
                if (!this.selectedPlate || !this.subPlatesCache.has(this.selectedPlate.name)) return;
                
                const subPlates = this.subPlatesCache.get(this.selectedPlate.name);
                const sortedSubPlates = this.sortSubPlatesArray(subPlates);
                
                // 更新选项卡内容
                sortedSubPlates.forEach(plate => {
                    const element = document.querySelector(`[data-sub-plate-id="${plate.id}"]`);
                    if (element) {
                        const changeClass = plate.change_pct >= 0 ? 'change-positive' : 'change-negative';
                        const changeSign = plate.change_pct >= 0 ? '+' : '';
                        
                        element.querySelector('.sub-plate-tab-change').textContent = 
                            `${changeSign}${(plate.change_pct * 100).toFixed(2)}%`;
                        element.querySelector('.sub-plate-tab-change').className = 
                            `sub-plate-tab-change ${changeClass}`;
                    }
                });
            }

            handleSubPlates(data) {
                console.log('📋 处理子板块数据:', data);
                if (data.main_plate && data.data) {
                    // 缓存子板块数据
                    this.subPlatesCache.set(data.main_plate, data.data);
                    
                    // 如果当前选中的主板块匹配，则更新显示
                    if (this.selectedPlate && this.selectedPlate.name === data.main_plate) {
                        this.renderSubPlatesAndStocks(data.data);
                    }
                }
            }

            // 在 handlePlateStocks 方法中，我们需要确保子板块股票数据被正确处理
            handlePlateStocks(data) {
                console.log('📊 处理个股数据:', data);
                if (data.plate_id && data.data) {
                    // 从pendingRequests中移除
                    this.pendingRequests.delete(`stocks_${data.plate_id}`);
                    
                    console.log(`📈 收到股票数据，板块ID: ${data.plate_id}, 股票数量: ${data.data.length}`);
                    
                    // 缓存股票数据
                    this.stocksCache.set(data.plate_id, data.data);
                    
                    // 检查是否是当前选中的主板块
                    if (this.selectedPlate && this.selectedPlate.id === data.plate_id) {
                        console.log(`✅ 更新主板块股票显示: ${this.selectedPlate.name}`);
                        
                        // 更新全部个股选项卡计数
                        this.updateAllStocksTabCount(data.data.length);
                        
                        // 如果没有选中子板块，更新显示全部个股
                        if (!this.selectedSubPlate) {
                            this.currentStocks = data.data;
                            this.updateStocksDisplay(data.data, `${this.selectedPlate.name} 全部个股`);
                            this.updateSelectedPlateInfo();
                        }
                    }
                    
                    // 检查是否是当前选中的子板块
                    if (this.selectedSubPlate && this.selectedSubPlate.id === data.plate_id) {
                        console.log(`✅ 更新选中的子板块股票: ${this.selectedSubPlate.name}`);
                        this.currentStocks = data.data;
                        this.updateStocksDisplay(data.data, `${this.selectedSubPlate.name} 成分股`);
                        this.updateSelectedPlateInfo();
                    }
                }
            }

            // 渲染子板块和股票（使用选项卡样式）
            renderSubPlatesAndStocks(subPlates) {
                const container = document.getElementById('plateDetails');
                if (!container) return;
                
                // 获取主板块的所有股票
                const mainPlateStocks = this.stocksCache.get(this.selectedPlate.id) || [];
                // 如果缓存为空但当前有股票数据，更新缓存
                if (mainPlateStocks.length === 0 && this.currentStocks.length > 0) {
                    mainPlateStocks = this.currentStocks;
                    this.stocksCache.set(this.selectedPlate.id, this.currentStocks);
                }
                // 排序子板块
                const sortedSubPlates = this.sortSubPlatesArray(subPlates);
                
                let html = `
                    <div class="breadcrumb">
                        <span class="breadcrumb-item" onclick="plateMonitor.backToMain()">全部板块</span>
                        <span class="breadcrumb-separator">></span>
                        <span class="breadcrumb-item">${this.selectedPlate.name}</span>
                    </div>
                    <div class="sub-plate-controls">
                        <div style="color: #d4af37; font-weight: 600;">
                            子板块筛选
                        </div>
                        <div class="sub-sort-controls">
                            <button class="control-btn small ${this.subPlateSort.field === 'change_pct' ? 'active' : ''}" onclick="plateMonitor.sortSubPlates('change_pct')">涨跌幅</button>
                            <button class="control-btn small ${this.subPlateSort.field === 'total_volume' ? 'active' : ''}" onclick="plateMonitor.sortSubPlates('total_volume')">成交额</button>
                        </div>
                    </div>
                    <div class="sub-plates-tabs" id="subPlatesTabs">
                        <div class="sub-plate-tab all-stocks-tab ${!this.selectedSubPlate ? 'selected' : ''}" 
                            onclick="plateMonitor.showAllStocks()">
                            <span class="sub-plate-tab-name">全部个股</span>
                            <span class="sub-plate-tab-change">${mainPlateStocks.length}只</span>
                        </div>
                `;
                
                // 添加子板块选项卡
                sortedSubPlates.forEach((plate, index) => {
                    const changeClass = plate.change_pct >= 0 ? 'change-positive' : 'change-negative';
                    const changeSign = plate.change_pct >= 0 ? '+' : '';
                    const isSelected = this.selectedSubPlate && this.selectedSubPlate.id === plate.id;
                    
                    html += `
                        <div class="sub-plate-tab ${isSelected ? 'selected' : ''}" 
                             data-sub-plate-id="${plate.id}" 
                             onclick="plateMonitor.filterStocksBySubPlate(${JSON.stringify(plate).replace(/"/g, '&quot;')})">
                            <span class="sub-plate-tab-name">${plate.name}</span>
                            <span class="sub-plate-tab-change ${changeClass}">
                                ${changeSign}${(plate.change_pct * 100).toFixed(2)}%
                            </span>
                        </div>
                    `;
                });
                
                html += `</div>`;
                
                // 添加股票列表
                const stocksToShow = this.selectedSubPlate ? 
                    (this.stocksCache.get(this.selectedSubPlate.id) || []) : 
                    mainPlateStocks;
                
                const title = this.selectedSubPlate ? 
                    `${this.selectedSubPlate.name} 成分股` : 
                    `${this.selectedPlate.name} 全部个股`;
                
                html += this.renderStocksSection(title, stocksToShow);
                
                container.innerHTML = html;
                
                // 保存子板块DOM引用
                this.cacheSubPlateElements();
                
                // 设置当前股票数据
                this.currentStocks = stocksToShow;
                this.updateSelectedPlateInfo();
            }

            // 显示所有股票（取消子板块筛选）
            showAllStocks() {
                this.selectedSubPlate = null;
                
                // 更新选项卡选中状态
                document.querySelectorAll('.sub-plate-tab.selected').forEach(tab => {
                    tab.classList.remove('selected');
                });
                document.querySelector('.sub-plate-tab.all-stocks-tab').classList.add('selected');
                
                // 显示所有股票
                const mainPlateStocks = this.stocksCache.get(this.selectedPlate.id) || [];
                // 如果缓存为空但当前有股票数据，使用当前数据
                if (mainPlateStocks.length === 0 && this.currentStocks.length > 0) {
                    mainPlateStocks = this.currentStocks;
                    this.stocksCache.set(this.selectedPlate.id, this.currentStocks);
                }
                this.updateStocksDisplay(mainPlateStocks, `${this.selectedPlate.name} 全部个股`);
                
                // 更新当前股票数据
                this.currentStocks = mainPlateStocks;
                this.updateSelectedPlateInfo();
                
                // 保存查看状态
                this.viewState.currentSubPlate = null;
                this.viewState.showStocks = true;
            }

            // 根据子板块筛选股票
            filterStocksBySubPlate(subPlate) {
                console.log(`🔍 筛选子板块: ${subPlate.name}, ID: ${subPlate.id}`);
                
                // 更新选项卡选中状态
                document.querySelectorAll('.sub-plate-tab.selected').forEach(tab => {
                    tab.classList.remove('selected');
                });
                
                const element = document.querySelector(`[data-sub-plate-id="${subPlate.id}"]`);
                if (element) {
                    element.classList.add('selected');
                }
                
                this.selectedSubPlate = subPlate;
                
                // 获取该子板块的股票数据
                if (this.stocksCache.has(subPlate.id)) {
                    // 使用缓存的子板块股票数据
                    const stocks = this.stocksCache.get(subPlate.id);
                    console.log(`📊 使用缓存的子板块股票数据: ${stocks.length}只`);
                    this.updateStocksDisplay(stocks, `${subPlate.name} 成分股`);
                    this.currentStocks = stocks;
                    this.updateSelectedPlateInfo();
                } else {
                    // 请求子板块股票数据
                    console.log(`📤 请求子板块股票数据: ${subPlate.id}`);
                    this.requestSubPlateStocks(subPlate.id);
                    
                    // 临时显示加载状态
                    this.updateStocksDisplay([], `正在加载 ${subPlate.name} 成分股...`);
                }
                
                // 保存查看状态
                this.viewState.currentSubPlate = subPlate;
                this.viewState.showStocks = true;
            }

            // 新增：请求子板块股票数据（防止重复请求）
            requestSubPlateStocks(plateId) {
                const requestKey = `stocks_${plateId}`;
                if (this.pendingRequests.has(requestKey)) {
                    console.log('⏳ 子板块股票数据请求已发送，等待响应...');
                    return;
                }
                
                this.pendingRequests.add(requestKey);
                this.sendMessage({
                    type: 'get_plate_stocks',
                    plate_id: plateId,
                    is_sub_plate: true
                });
            }

            // 新增：请求主板块股票数据（防止重复请求）
            requestMainPlateStocks(plateId) {
                const requestKey = `stocks_${plateId}`;
                if (this.pendingRequests.has(requestKey)) {
                    console.log('⏳ 主板块股票数据请求已发送，等待响应...');
                    return;
                }
                
                this.pendingRequests.add(requestKey);
                this.sendMessage({
                    type: 'get_plate_stocks',
                    plate_id: plateId,
                    is_main_plate: true
                });
            }

            // 新增：个股排序方法
            sortStocks(field, direction = 'desc') {
                if (this.stockSort.field === field) {
                    this.stockSort.direction = this.stockSort.direction === 'desc' ? 'asc' : 'desc';
                } else {
                    this.stockSort.field = field;
                    this.stockSort.direction = direction;
                }
                
                if (this.currentStocks.length > 0) {
                    this.applyStockSort();
                    this.updateStocksDisplay(this.currentStocks, this.getCurrentStockTitle());
                    this.updateStockHeaderSortClasses();
                }
            }
            
            // 新增：应用个股排序
            applyStockSort() {
                if (this.currentStocks.length === 0) return;
                
                this.currentStocks.sort((a, b) => {
                    let aVal = a[this.stockSort.field] || 0;
                    let bVal = b[this.stockSort.field] || 0;
                    
                    // 特殊处理：股票名称按字母排序
                    if (this.stockSort.field === 'name') {
                        aVal = a.name || '';
                        bVal = b.name || '';
                        return this.stockSort.direction === 'desc' ? 
                            bVal.localeCompare(aVal) : aVal.localeCompare(bVal);
                    }
                    
                    // 特殊处理：股票代码按字母排序
                    if (this.stockSort.field === 'code') {
                        aVal = a.code || '';
                        bVal = b.code || '';
                        return this.stockSort.direction === 'desc' ? 
                            bVal.localeCompare(aVal) : aVal.localeCompare(bVal);
                    }
                    
                    // 数值排序
                    if (this.stockSort.direction === 'desc') {
                        return bVal - aVal;
                    } else {
                        return aVal - bVal;
                    }
                });
            }
            
            // 新增：获取当前股票列表标题
            getCurrentStockTitle() {
                if (this.selectedSubPlate) {
                    return `${this.selectedSubPlate.name} 成分股`;
                } else if (this.selectedPlate) {
                    return `${this.selectedPlate.name} 全部个股`;
                }
                return '个股列表';
            }
            
            // 新增：更新股票表头排序样式
            updateStockHeaderSortClasses() {
                const headerItems = document.querySelectorAll('.stock-header-item');
                headerItems.forEach(item => {
                    item.classList.remove('sort-asc', 'sort-desc');
                });
                
                const currentHeader = document.querySelector(`.stock-header-item[onclick*="${this.stockSort.field}"]`);
                if (currentHeader) {
                    currentHeader.classList.add(this.stockSort.direction === 'desc' ? 'sort-desc' : 'sort-asc');
                }
            }

            // 更新股票显示（确保选中状态正确）
            updateStocksDisplay(stocks, title) {
                const container = document.getElementById('plateDetails');
                let stocksSection = container.querySelector('.stocks-section');
                
                if (!stocksSection) {
                    stocksSection = document.createElement('div');
                    stocksSection.className = 'stocks-section';
                    container.appendChild(stocksSection);
                }
                
                // 应用排序
                this.currentStocks = stocks;
                this.applyStockSort();
                
                // 如果是主板块的全部个股，确保更新缓存和选项卡计数
                if (title.includes('全部个股') && this.selectedPlate && !this.selectedSubPlate) {
                    this.stocksCache.set(this.selectedPlate.id, stocks);
                    this.updateAllStocksTabCount(stocks.length);
                }
                
                if (this.currentStocks.length === 0) {
                    stocksSection.innerHTML = `
                        <div style="margin-bottom: 15px; color: #d4af37; font-weight: 600;">
                            ${title} (0)
                        </div>
                        <div class="loading">正在加载个股数据...</div>
                    `;
                } else {
                    stocksSection.innerHTML = this.renderStocksHTML(title, this.currentStocks);
                }
            }
            // 更新全部个股选项卡数量
            updateAllStocksTabCount(count) {
                const allStocksTab = document.querySelector('.sub-plate-tab.all-stocks-tab');
                if (allStocksTab) {
                    const countElement = allStocksTab.querySelector('.sub-plate-tab-change');
                    if (countElement) {
                        countElement.textContent = `${count}只`;
                    }
                }
                
                // 同时更新缓存中的主板块股票数量
                if (this.selectedPlate) {
                    const currentStocks = this.stocksCache.get(this.selectedPlate.id) || [];
                    if (currentStocks.length !== count && count > 0) {
                        // 如果缓存中的数据数量不一致，可能需要重新请求
                        console.log(`🔄 缓存数据不一致，重新请求主板块股票: ${this.selectedPlate.name}`);
                        this.requestMainPlateStocks(this.selectedPlate.id);
                    }
                }
            }
            // 渲染股票部分的HTML
            renderStocksSection(title, stocks) {
                return `
                    <div class="stocks-section">
                        ${this.renderStocksHTML(title, stocks)}
                    </div>
                `;
            }

            // 渲染股票列表的HTML
            renderStocksHTML(title, stocks) {
                const getSortClass = (field) => {
                    if (this.stockSort.field === field) {
                        return this.stockSort.direction === 'desc' ? 'sort-desc' : 'sort-asc';
                    }
                    return '';
                };
                
                let html = `
                    <div style="margin-bottom: 15px; color: #d4af37; font-weight: 600;">
                        ${title} (${stocks.length})
                    </div>
                    <div class="stocks-header">
                        <div class="stock-header-item ${getSortClass('name')}" onclick="plateMonitor.sortStocks('name')">股票名称</div>
                        <div class="stock-header-item ${getSortClass('code')}" onclick="plateMonitor.sortStocks('code')">代码</div>
                        <div class="stock-header-item ${getSortClass('change_pct')}" onclick="plateMonitor.sortStocks('change_pct')">涨跌幅</div>
                        <div class="stock-header-item ${getSortClass('price')}" onclick="plateMonitor.sortStocks('price')">最新价</div>
                        <div class="stock-header-item ${getSortClass('volume')}" onclick="plateMonitor.sortStocks('volume')">成交额</div>
                        <div class="stock-header-item ${getSortClass('market_cap')}" onclick="plateMonitor.sortStocks('market_cap')">市值</div>
                    </div>
                `;
                
                stocks.forEach(stock => {
                    const changeClass = stock.change_pct >= 0 ? 'change-positive' : 'change-negative';
                    const changeSign = stock.change_pct >= 0 ? '+' : '';
                    
                    html += `
                        <div class="stock-row">
                            <div class="stock-name">${stock.name}</div>
                            <div class="stock-code">${stock.code}</div>
                            <div class="${changeClass}">${changeSign}${(stock.change_pct * 100).toFixed(2)}%</div>
                            <div>${stock.price ? stock.price.toFixed(2) : '--'}</div>
                            <div>${this.formatNumber(stock.volume)}</div>
                            <div>${this.formatNumber(stock.market_cap)}</div>
                        </div>
                    `;
                });
                
                return html;
            }
            
            // 修复板块排序问题
            updatePlateData(existingPlates, newPlates, plateType) {
                const plateMap = new Map();
                
                existingPlates.forEach(plate => {
                    plateMap.set(plate.id, plate);
                });
                
                newPlates.forEach(newPlate => {
                    const existingPlate = plateMap.get(newPlate.id);
                    if (existingPlate) {
                        const hasChanged = this.checkPlateChanges(existingPlate, newPlate);
                        Object.assign(existingPlate, newPlate);
                    } else {
                        existingPlates.push(newPlate);
                        plateMap.set(newPlate.id, newPlate);
                    }
                });
                
                this.updateCurrentPlates();
            }
            
            checkPlateChanges(oldPlate, newPlate) {
                const fields = ['change_pct', 'total_volume', 'total_large_net', 'rise_count', 'fall_count'];
                return fields.some(field => {
                    const oldVal = oldPlate[field] || 0;
                    const newVal = newPlate[field] || 0;
                    return Math.abs(oldVal - newVal) > 0.0001;
                });
            }
            
            updateCurrentPlates() {
                this.currentPlates = this.currentPlateType === 'main' ? this.mainPlates : this.allPlates;
                this.sortCurrentPlates();
                this.updateDisplayedPlates();
            }
            
            sortCurrentPlates() {
                if (!this.currentPlates.length) return;
                
                this.currentPlates.sort((a, b) => {
                    let aVal = a[this.currentSort.field] || 0;
                    let bVal = b[this.currentSort.field] || 0;
                    
                    // 特殊处理：板块名称按字母排序
                    if (this.currentSort.field === 'name') {
                        aVal = a.name || '';
                        bVal = b.name || '';
                        return this.currentSort.direction === 'desc' ? 
                            bVal.localeCompare(aVal) : aVal.localeCompare(bVal);
                    }
                    
                    // 数值排序
                    if (this.currentSort.direction === 'desc') {
                        return bVal - aVal;
                    } else {
                        return aVal - bVal;
                    }
                });
            }
            
            updateDisplayedPlates() {
                this.displayedPlates = this.currentPlates.slice(0, this.displayCount);
            }
            
            updatePlatesDisplay() {
                if (this.plateElements.size === 0) {
                    this.renderPlatesTable();
                    return;
                }
                
                this.displayedPlates.forEach(plate => {
                    const element = this.plateElements.get(plate.id);
                    if (element) {
                        this.updatePlateElement(element, plate);
                    }
                });
            }
            
            updatePlateElement(element, plate) {
                const changeClass = plate.change_pct >= 0 ? 'change-positive' : 'change-negative';
                const changeSign = plate.change_pct >= 0 ? '+' : '';
                
                const changeElement = element.querySelector('.change-value');
                if (changeElement) {
                    changeElement.textContent = `${changeSign}${(plate.change_pct * 100).toFixed(2)}%`;
                    changeElement.className = `change-value ${changeClass}`;
                    changeElement.classList.add('value-updated');
                    setTimeout(() => changeElement.classList.remove('value-updated'), 1000);
                }
                
                const volumeElement = element.querySelector('.volume-value');
                if (volumeElement) {
                    volumeElement.textContent = this.formatNumber(plate.total_volume);
                    volumeElement.classList.add('value-updated');
                    setTimeout(() => volumeElement.classList.remove('value-updated'), 1000);
                }
                
                const netElement = element.querySelector('.net-value');
                if (netElement) {
                    netElement.textContent = this.formatNumber(plate.total_large_net);
                    netElement.className = `net-value ${plate.total_large_net >= 0 ? 'change-positive' : 'change-negative'}`;
                    netElement.classList.add('value-updated');
                    setTimeout(() => netElement.classList.remove('value-updated'), 1000);
                }
                
                const riseFallElement = element.querySelector('.rise-fall-value');
                if (riseFallElement) {
                    riseFallElement.innerHTML = `
                        <span class="change-positive">${plate.rise_count || 0}↑</span> / 
                        <span class="change-negative">${plate.fall_count || 0}↓</span>
                    `;
                }
                
                const stockElement = element.querySelector('.stock-value');
                if (stockElement) {
                    stockElement.textContent = plate.stock_count || 0;
                }
            }
            
            renderPlatesTable() {
                const container = document.getElementById('platesContainer');
                this.plateElements.clear();
                
                if (this.displayedPlates.length === 0) {
                    container.innerHTML = '<div class="loading">正在加载板块数据...</div>';
                    return;
                }
                
                let html = `
                    <div class="plates-flex-container">
                        <div class="plate-header">
                            <div class="plate-header-item ${this.getSortClass('name')}" onclick="plateMonitor.sortPlates('name')">板块名称</div>
                            <div class="plate-header-item ${this.getSortClass('change_pct')}" onclick="plateMonitor.sortPlates('change_pct')">涨跌幅</div>
                            <div class="plate-header-item ${this.getSortClass('total_volume')}" onclick="plateMonitor.sortPlates('total_volume')">成交额</div>
                            <div class="plate-header-item ${this.getSortClass('total_large_net')}" onclick="plateMonitor.sortPlates('total_large_net')">主力净额</div>
                            <div class="plate-header-item ${this.getSortClass('rise_count')}" onclick="plateMonitor.sortPlates('rise_count')">涨/跌</div>
                            <div class="plate-header-item ${this.getSortClass('stock_count')}" onclick="plateMonitor.sortPlates('stock_count')">成分股</div>
                        </div>
                `;
                
                this.displayedPlates.forEach((plate, index) => {
                    const changeClass = plate.change_pct >= 0 ? 'change-positive' : 'change-negative';
                    const changeSign = plate.change_pct >= 0 ? '+' : '';
                    const turnover = this.formatNumber(plate.total_volume);
                    const mainNet = this.formatNumber(plate.total_large_net);
                    const isSelected = this.selectedPlate && this.selectedPlate.id === plate.id;
                    const rowClass = isSelected ? 'plate-row plate-selected' : 'plate-row';
                    
                    html += `
                        <div class="${rowClass}" data-plate-id="${plate.id}" onclick="plateMonitor.selectPlate(${JSON.stringify(plate).replace(/"/g, '&quot;')})">
                            <div>
                                <span class="plate-name">${plate.name}</span>
                            </div>
                            <div>
                                <span class="change-value ${changeClass}">${changeSign}${(plate.change_pct * 100).toFixed(2)}%</span>
                            </div>
                            <div><span class="volume-value">${turnover}</span></div>
                            <div>
                                <span class="net-value ${plate.total_large_net >= 0 ? 'change-positive' : 'change-negative'}">${mainNet}</span>
                            </div>
                            <div>
                                <span class="rise-fall-value">
                                    <span class="change-positive">${plate.rise_count || 0}↑</span> / 
                                    <span class="change-negative">${plate.fall_count || 0}↓</span>
                                </span>
                            </div>
                            <div><span class="stock-value">${plate.stock_count || 0}</span></div>
                        </div>
                    `;
                });
                
                html += '</div>';
                container.innerHTML = html;
                
                this.displayedPlates.forEach(plate => {
                    const element = container.querySelector(`[data-plate-id="${plate.id}"]`);
                    if (element) {
                        this.plateElements.set(plate.id, element);
                    }
                });
                
                // 更新表头排序指示器
                this.updateHeaderSortClasses();
            }
            
            // 修复：板块排序方法
            sortPlates(field, direction = null) {
                if (this.currentSort.field === field) {
                    // 如果点击同一列，切换排序方向
                    this.currentSort.direction = this.currentSort.direction === 'desc' ? 'asc' : 'desc';
                } else {
                    // 如果点击不同列，设置新的排序字段，默认降序
                    this.currentSort.field = field;
                    this.currentSort.direction = direction || 'desc';
                }
                
                console.log(`🔄 板块排序: ${field}, 方向: ${this.currentSort.direction}`);
                
                this.updateCurrentPlates();
                this.renderPlatesTable();
                this.updateSortInfo();
            }
            
            updateHeaderSortClasses() {
                const headerItems = document.querySelectorAll('.plate-header-item');
                headerItems.forEach(item => {
                    item.classList.remove('sort-asc', 'sort-desc');
                });
                
                const currentHeader = document.querySelector(`.plate-header-item[onclick*="${this.currentSort.field}"]`);
                if (currentHeader) {
                    currentHeader.classList.add(this.currentSort.direction === 'desc' ? 'sort-desc' : 'sort-asc');
                }
            }
            
            togglePlateType() {
                this.currentPlateType = this.currentPlateType === 'main' ? 'all' : 'main';
                this.updateCurrentPlates();
                this.renderPlatesTable();
                this.updatePlateTypeButton();
            }
            
            toggleAutoUpdate() {
                this.autoUpdate = !this.autoUpdate;
                const btn = document.getElementById('autoUpdateBtn');
                if (this.autoUpdate) {
                    btn.textContent = '自动更新:开';
                    btn.classList.add('active');
                    this.showMessage('✅ 已开启自动更新');
                } else {
                    btn.textContent = '自动更新:关';
                    btn.classList.remove('active');
                    this.showMessage('❌ 已关闭自动更新');
                }
            }
            
            selectPlate(plate) {
                document.querySelectorAll('.plate-selected').forEach(el => {
                    el.classList.remove('plate-selected');
                });
                
                const element = document.querySelector(`[data-plate-id="${plate.id}"]`);
                if (element) {
                    element.classList.add('plate-selected');
                }
                
                this.selectedPlate = plate;
                this.selectedSubPlate = null;
                this.currentStocks = [];
                
                this.viewState.currentMainPlate = plate;
                this.viewState.currentSubPlate = null;
                this.viewState.showStocks = false;
                
                this.loadSubPlates(plate.name);
                this.requestMainPlateStocks(plate.id);
            }
            
            loadSubPlates(plateName) {
                this.selectedPlate = this.allPlates.find(p => p.name === plateName) || this.mainPlates.find(p => p.name === plateName);
                if (!this.selectedPlate) return;
                
                document.getElementById('detailTitle').textContent = `📈 ${plateName}`;
                
                if (this.subPlatesCache.has(plateName)) {
                    console.log('📋 使用缓存的子板块数据');
                    if (this.stocksCache.has(this.selectedPlate.id)) {
                        this.renderSubPlatesAndStocks(this.subPlatesCache.get(plateName));
                    }
                } else {
                    this.sendMessage({
                        type: 'get_sub_plates',
                        main_plate: plateName
                    });
                    
                    document.getElementById('plateDetails').innerHTML = '<div class="loading">正在加载子板块数据...</div>';
                }
            }
            
            cacheSubPlateElements() {
                this.subPlateElements.clear();
                const elements = document.querySelectorAll('[data-sub-plate-id]');
                elements.forEach(element => {
                    const plateId = element.getAttribute('data-sub-plate-id');
                    this.subPlateElements.set(plateId, element);
                });
            }

            sortSubPlates(field) {
                if (this.subPlateSort.field === field) {
                    this.subPlateSort.direction = this.subPlateSort.direction === 'desc' ? 'asc' : 'desc';
                } else {
                    this.subPlateSort.field = field;
                    this.subPlateSort.direction = 'desc';
                }
                
                this.applySubPlateSort();
                this.updateSubPlateSortButtons();
            }

            sortSubPlatesArray(plates) {
                return [...plates].sort((a, b) => {
                    let aVal = a[this.subPlateSort.field] || 0;
                    let bVal = b[this.subPlateSort.field] || 0;
                    
                    if (this.subPlateSort.direction === 'desc') {
                        return bVal - aVal;
                    } else {
                        return aVal - bVal;
                    }
                });
            }

            applySubPlateSort() {
                if (!this.selectedPlate) return;
                
                const cachedSubPlates = this.subPlatesCache.get(this.selectedPlate.name);
                if (cachedSubPlates) {
                    this.renderSubPlatesAndStocks(cachedSubPlates);
                }
            }

            updateSubPlateSortButtons() {
                const buttons = document.querySelectorAll('.sub-sort-controls .control-btn.small');
                buttons.forEach(btn => {
                    btn.classList.remove('active');
                });
                
                const activeBtn = document.querySelector(`.sub-sort-controls .control-btn.small[onclick*="${this.subPlateSort.field}"]`);
                if (activeBtn) {
                    activeBtn.classList.add('active');
                }
            }
            
            backToMain() {
                this.viewState.currentMainPlate = null;
                this.viewState.currentSubPlate = null;
                this.viewState.showStocks = false;
                document.getElementById('plateDetails').innerHTML = '<div class="no-data">请从左侧板块列表中选择一个板块查看其详细信息</div>';
                document.getElementById('detailTitle').textContent = '📈 板块详情';
                document.getElementById('selectedPlateInfo').textContent = '请选择板块查看详情';
            }
            
            showRealTimeUpdate() {
                this.showRealTimeBadge();
                
                const indicator = document.createElement('div');
                indicator.className = 'update-indicator';
                indicator.innerHTML = '<span>🔄</span> 数据更新 ' + new Date().toLocaleTimeString();
                document.body.appendChild(indicator);
                
                setTimeout(() => {
                    if (indicator.parentNode) {
                        indicator.parentNode.removeChild(indicator);
                    }
                }, 2000);
            }
            
            getSortClass(field) {
                if (this.currentSort.field === field) {
                    return this.currentSort.direction === 'desc' ? 'sort-desc' : 'sort-asc';
                }
                return '';
            }
            
            updateStats() {
                this.stats.total = this.currentPlates.length;
                this.stats.rise = this.currentPlates.filter(p => p.change_pct > 0).length;
                this.stats.fall = this.currentPlates.filter(p => p.change_pct < 0).length;
                
                const totalStocks = this.stats.rise + this.stats.fall;
                const marketRiseRate = totalStocks > 0 ? (this.stats.rise / totalStocks * 100).toFixed(1) : 0;
                
                const totalVolume = this.currentPlates.reduce((sum, plate) => sum + (plate.total_volume || 0), 0);
                
                document.getElementById('totalPlates').textContent = this.stats.total;
                document.getElementById('risePlates').textContent = this.stats.rise;
                document.getElementById('fallPlates').textContent = this.stats.fall;
                document.getElementById('marketRiseRate').textContent = `${marketRiseRate}%`;
                document.getElementById('totalVolume').textContent = this.formatNumber(totalVolume);
                document.getElementById('updateTime').textContent = new Date().toLocaleTimeString();
            }
            
            updateSelectedPlateInfo() {
                const infoElement = document.getElementById('selectedPlateInfo');
                if (this.selectedSubPlate) {
                    const changePct = (this.selectedSubPlate.change_pct * 100).toFixed(2);
                    const changeSign = this.selectedSubPlate.change_pct >= 0 ? '+' : '';
                    infoElement.textContent = `${this.selectedPlate.name} > ${this.selectedSubPlate.name} ${changeSign}${changePct}% | ${this.currentStocks.length}只个股`;
                } else if (this.selectedPlate) {
                    const changePct = (this.selectedPlate.change_pct * 100).toFixed(2);
                    const changeSign = this.selectedPlate.change_pct >= 0 ? '+' : '';
                    infoElement.textContent = `${this.selectedPlate.name} ${changeSign}${changePct}% | ${this.currentStocks.length}只个股`;
                } else {
                    infoElement.textContent = '请选择板块';
                }
            }
            
            updateSortInfo() {
                const fieldNames = {
                    'change_pct': '涨跌幅',
                    'total_volume': '成交额', 
                    'total_large_net': '主力净额',
                    'rise_count': '上涨家数',
                    'name': '名称'
                };
                
                const direction = this.currentSort.direction === 'desc' ? '降序' : '升序';
                document.getElementById('sortInfo').textContent = 
                    `按${fieldNames[this.currentSort.field]}${direction}排序`;
            }
            
            updatePlateTypeButton() {
                const btn = document.getElementById('plateTypeBtn');
                btn.textContent = this.currentPlateType === 'main' ? '主流板块' : '全部板块';
                btn.classList.toggle('active', this.currentPlateType === 'main');
                document.getElementById('leftTitle').textContent = 
                    this.currentPlateType === 'main' ? '🏆 主流板块排行' : '📊 全部板块排行';
            }
            
            updateConnectionStatus(connected) {
                const statusElement = document.getElementById('connectionStatus');
                if (connected) {
                    statusElement.innerHTML = '<span class="status-icon">✅</span> 已连接';
                    statusElement.className = 'connection-status status-connected';
                } else {
                    statusElement.innerHTML = '<span class="status-icon">❌</span> 断开连接';
                    statusElement.className = 'connection-status status-disconnected';
                }
            }
            
            showRealTimeBadge() {
                document.getElementById('realTimeBadge').style.display = 'inline';
            }
            
            hideRealTimeBadge() {
                document.getElementById('realTimeBadge').style.display = 'none';
            }
            
            formatNumber(num) {
                if (num === undefined || num === null) return '0';
                
                const absNum = Math.abs(num);
                if (absNum >= 100000000) {
                    return (num / 100000000).toFixed(2) + '亿';
                } else if (absNum >= 10000) {
                    return (num / 10000).toFixed(0) + '万';
                }
                return num.toString();
            }
            
            refreshData() {
                if (this.ws) {
                    this.ws.close();
                }
                this.connect();
                this.showMessage('正在刷新数据...');
            }
            
            sendMessage(message) {
                if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                    this.ws.send(JSON.stringify(message));
                } else {
                    console.warn('WebSocket未连接，无法发送消息');
                    this.showMessage('连接未就绪，请等待重连...');
                }
            }
            
            showMessage(message) {
                console.log('系统消息:', message);
            }
            
            setupEventListeners() {
                document.getElementById('connectionStatus').addEventListener('click', () => {
                    this.connect();
                });
            }
            
            setupScrollLoading() {
                const container = document.getElementById('platesContainer');
                container.addEventListener('scroll', () => {
                    const { scrollTop, scrollHeight, clientHeight } = container;
                    if (scrollTop + clientHeight >= scrollHeight - 50) {
                        this.loadMorePlates();
                    }
                });
            }
            
            loadMorePlates() {
                if (this.isLoading || this.displayCount >= this.currentPlates.length) return;
                
                this.isLoading = true;
                this.displayCount += 20;
                this.updateDisplayedPlates();
                this.renderPlatesTable();
                this.isLoading = false;
            }
        }
        
        const plateMonitor = new PlateMonitor();
        
        document.addEventListener('DOMContentLoaded', function() {
            plateMonitor.init();
        });
    </script>
</body>
</html>
