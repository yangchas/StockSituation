<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时板块监控系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 100%);
            color: #e0e0e0;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            background: rgba(26, 26, 46, 0.8);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            border: 1px solid #333;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }
        
        .header h1 {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 28px;
            margin-bottom: 15px;
            color: #fff;
        }
        
        .connection-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .status-connected {
            background: linear-gradient(135deg, #00c853, #64dd17);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 200, 83, 0.3);
        }
        
        .status-disconnected {
            background: linear-gradient(135deg, #ff1744, #f50057);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 23, 68, 0.3);
        }
        
        .real-time-badge {
            background: linear-gradient(135deg, #ffab00, #ff6d00);
            color: #000;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            animation: pulse 2s infinite;
            box-shadow: 0 4px 15px rgba(255, 171, 0, 0.3);
        }
        
        .control-panel {
            display: flex;
            gap: 12px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        
        .control-btn {
            padding: 10px 18px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .control-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .control-btn.active {
            background: linear-gradient(135deg, #d4af37, #f7ef8a);
            color: #000;
            border-color: #d4af37;
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
        }
        
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin: 20px 0;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .stat-item {
            text-align: center;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            transition: all 0.3s;
        }
        
        .stat-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 14px;
            color: #aaa;
        }
        
        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            height: 70vh;
        }
        
        .section {
            background: rgba(26, 26, 46, 0.8);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid #333;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
        }
        
        .section-header h2 {
            font-size: 20px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .plates-container {
            flex: 1;
            overflow-y: auto;
            position: relative;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.2);
        }
        
        /* 使用flex布局实现高性能排序 */
        .plates-flex-container {
            display: flex;
            flex-direction: column;
            min-height: 100%;
        }
        
        .plate-header {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr 1fr 0.8fr;
            gap: 10px;
            padding: 15px 12px;
            background: rgba(40, 40, 60, 0.8);
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 10;
            font-weight: 600;
        }
        
        .plate-header-item {
            cursor: pointer;
            user-select: none;
            transition: all 0.3s;
            padding: 5px;
            border-radius: 4px;
        }
        
        .plate-header-item:hover {
            background: rgba(50, 50, 70, 0.9);
        }
        
        .plate-header-item.sort-asc::after {
            content: " ↑";
            color: #d4af37;
        }
        
        .plate-header-item.sort-desc::after {
            content: " ↓";
            color: #d4af37;
        }
        
        .plate-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr 1fr 0.8fr;
            gap: 10px;
            padding: 14px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s;
            align-items: center;
        }
        
        .plate-row:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        
        .plate-row.plate-selected {
            background: rgba(41, 98, 255, 0.2);
            border-left: 4px solid #d4af37;
        }
        
        .change-positive {
            color: #ff5252;
            font-weight: 600;
        }
        
        .change-negative {
            color: #4caf50;
            font-weight: 600;
        }
        
        .plate-name {
            font-weight: bold;
            color: #d4af37;
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .plate-name:hover {
            color: #f7ef8a;
        }
        
        .value-updated {
            animation: valueUpdate 1s ease;
        }
        
        @keyframes valueUpdate {
            0% { background: rgba(76, 175, 80, 0.3); }
            100% { background: transparent; }
        }
        
        .sub-plates-container {
            flex: 1;
            overflow-y: auto;
            padding: 5px;
        }
        
        .sub-plates-flex-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .sub-plate-card {
            background: rgba(40, 40, 60, 0.6);
            padding: 18px;
            border-radius: 12px;
            border-left: 4px solid #444;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            cursor: pointer;
        }
        
        .sub-plate-card:hover {
            background: rgba(50, 50, 70, 0.8);
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }
        
        .sub-plate-card.selected {
            border-left-color: #d4af37;
            background: rgba(41, 98, 255, 0.2);
            box-shadow: 0 8px 25px rgba(41, 98, 255, 0.3);
        }
        
        .sub-plate-name {
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 16px;
            color: #fff;
        }
        
        .sub-plate-change {
            font-size: 20px;
            font-weight: bold;
            margin: 8px 0;
        }
        
        .sub-plate-stats {
            font-size: 13px;
            color: #aaa;
            line-height: 1.5;
        }
        
        .sub-plate-controls {
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .sub-sort-controls {
            display: flex;
            gap: 10px;
        }
        
        .control-btn.small {
            padding: 6px 12px;
            font-size: 12px;
            background: rgba(255, 255, 255, 0.05);
        }
        
        .control-btn.small.active {
            background: linear-gradient(135deg, #d4af37, #f7ef8a);
            color: #000;
        }
        
        .stocks-section {
            margin-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 20px;
        }
        
        .stocks-header {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr 1fr;
            gap: 10px;
            padding: 12px;
            background: rgba(40, 40, 60, 0.6);
            border-radius: 8px;
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .stock-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr 1fr;
            gap: 10px;
            padding: 10px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s;
            align-items: center;
        }
        
        .stock-row:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        
        .stock-name {
            font-weight: 500;
            color: #e0e0e0;
        }
        
        .stock-code {
            font-size: 12px;
            color: #aaa;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 16px;
        }
        
        .no-data {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 16px;
        }
        
        .refresh-btn {
            background: linear-gradient(135deg, #d4af37, #f7ef8a);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
        }
        
        .loading-more {
            text-align: center;
            padding: 15px;
            color: #666;
            font-size: 14px;
        }
        
        .update-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #d4af37, #f7ef8a);
            color: #000;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            z-index: 1000;
            animation: slideIn 0.5s ease;
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        
        .breadcrumb-item {
            color: #d4af37;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .breadcrumb-item:hover {
            color: #f7ef8a;
            text-decoration: underline;
        }
        
        .breadcrumb-separator {
            color: #666;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }
        
        @keyframes slideIn {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: rgba(212, 175, 55, 0.5);
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(212, 175, 55, 0.7);
        }
        
        /* 响应式设计 */
        @media (max-width: 1200px) {
            .content {
                grid-template-columns: 1fr;
                height: auto;
            }
            
            .section {
                min-height: 500px;
            }
        }
        
        @media (max-width: 768px) {
            .control-panel {
                justify-content: center;
            }
            
            .stats-bar {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .sub-plates-grid {
                grid-template-columns: 1fr;
            }
            
            .plate-header,
            .plate-row {
                grid-template-columns: 1.5fr 1fr 1fr 1fr;
                gap: 8px;
            }
            
            .plate-header-item:nth-child(5),
            .plate-row > div:nth-child(5),
            .plate-header-item:nth-child(6),
            .plate-row > div:nth-child(6) {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>
                📊 板块实时监控系统 
                <span id="connectionStatus" class="connection-status status-disconnected">
                    <span class="status-icon">❌</span> 断开连接
                </span>
                <span id="realTimeBadge" class="real-time-badge" style="display: none;">实时更新中</span>
            </h1>
            
            <!-- 简化后的控制面板 -->
            <div class="control-panel">
                <button class="control-btn" onclick="plateMonitor.togglePlateType()" id="plateTypeBtn">
                    <span>🏆</span> 主流板块
                </button>
                <button class="control-btn active" onclick="plateMonitor.toggleAutoUpdate()" id="autoUpdateBtn">
                    <span>🔄</span> 自动更新:开
                </button>
                <button class="refresh-btn" onclick="plateMonitor.refreshData()">
                    <span>🔄</span> 刷新数据
                </button>
            </div>
            
            <!-- 全市场指标展示 -->
            <div class="stats-bar">
                <div class="stat-item">
                    <div class="stat-value" id="totalPlates">0</div>
                    <div class="stat-label">总板块数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value change-positive" id="risePlates">0</div>
                    <div class="stat-label">上涨板块</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value change-negative" id="fallPlates">0</div>
                    <div class="stat-label">下跌板块</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="marketRiseRate">--%</div>
                    <div class="stat-label">市场上涨率</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="totalVolume">--</div>
                    <div class="stat-label">总成交额</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="updateTime">--:--:--</div>
                    <div class="stat-label">最后更新</div>
                </div>
            </div>
        </div>
        
        <div class="content">
            <div class="section">
                <div class="section-header">
                    <h2 id="leftTitle">🏆 板块排行</h2>
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <span id="sortInfo" style="font-size: 14px; color: #aaa;">按涨跌幅排序</span>
                        <button class="refresh-btn" onclick="plateMonitor.refreshData()">
                            <span>🔄</span> 刷新数据
                        </button>
                    </div>
                </div>
                <div class="plates-container" id="platesContainer">
                    <div class="loading">正在连接服务器，加载板块数据...</div>
                </div>
            </div>
            
            <div class="section">
                <div class="section-header">
                    <h2 id="detailTitle">📈 板块详情</h2>
                    <span id="selectedPlateInfo" style="font-size: 14px; color: #aaa;">请选择板块查看详情</span>
                </div>
                <div class="sub-plates-container" id="plateDetails">
                    <div class="no-data">请从左侧板块列表中选择一个板块查看其详细信息</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        class PlateMonitor {
            constructor() {
                this.ws = null;
                this.allPlates = [];
                this.mainPlates = [];
                this.displayedPlates = [];
                this.currentPlates = [];
                this.currentSort = { field: 'change_pct', direction: 'desc' };
                this.currentPlateType = 'main';
                this.selectedPlate = null;
                this.selectedSubPlate = null;
                this.currentStocks = [];
                this.autoUpdate = true;
                this.displayCount = 30;
                this.isLoading = false;
                this.lastUpdateTime = 0;
                this.updateCount = 0;
                this.dataUpdateInterval = null;
                this.plateElements = new Map();
                this.stockElements = new Map();
                
                // 新增：子板块DOM管理和排序
                this.subPlateElements = new Map();
                this.subPlateSort = { field: 'change_pct', direction: 'desc' };
                
                this.stats = {
                    total: 0,
                    rise: 0,
                    fall: 0
                };

                // 新增：保存当前查看状态
                this.viewState = {
                    currentMainPlate: null,
                    currentSubPlate: null,
                    showStocks: false
                };
            }
            
            init() {
                this.connect();
                this.setupEventListeners();
                this.setupScrollLoading();
            }
            
            connect() {
                try {
                    // 连接真实的WebSocket服务
                    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                    const host = window.location.host;
                    const wsUrl = `ws://115.190.156.240:8080/ws/plate`;
                    
                    this.ws = new WebSocket(wsUrl);
                    
                    this.ws.onopen = () => {
                        console.log('✅ 板块WebSocket连接成功');
                        this.updateConnectionStatus(true);
                        this.showMessage('连接成功，正在加载数据...');
                    };
                    
                    this.ws.onmessage = (event) => {
                        try {
                            const data = JSON.parse(event.data);
                            this.handleWebSocketMessage(data);
                        } catch (error) {
                            console.error('解析WebSocket消息失败:', error, event.data);
                        }
                    };
                    
                    this.ws.onerror = (error) => {
                        console.error('WebSocket连接错误:', error);
                        this.updateConnectionStatus(false);
                        this.showMessage('连接错误，正在尝试重连...');
                    };
                    
                    this.ws.onclose = () => {
                        console.log('WebSocket连接关闭');
                        this.updateConnectionStatus(false);
                        // 5秒后尝试重连
                        setTimeout(() => this.connect(), 5000);
                    };
                    
                } catch (error) {
                    console.error('连接失败:', error);
                    setTimeout(() => this.connect(), 5000);
                }
            }
            
            handleWebSocketMessage(data) {
                console.log('📡 收到WebSocket消息:', data.type);
                
                if (data.type === 'plate_init') {
                    this.handlePlateInit(data);
                } else if (data.type === 'plate_update') {
                    this.handlePlateUpdate(data);
                } else if (data.type === 'sub_plates') {
                    this.handleSubPlates(data);
                } else if (data.type === 'error') {
                    console.error('服务器返回错误:', data.message);
                    this.showMessage(`服务器错误: ${data.message}`);
                }
            }
            
            handlePlateInit(data) {
                console.log('📊 处理初始化数据');
                
                if (data.data) {
                    // 处理所有板块数据
                    if (data.data.all_plates) {
                        this.allPlates = data.data.all_plates;
                        console.log(`📈 加载所有板块: ${this.allPlates.length}个`);
                    }
                    
                    // 处理主流板块数据
                    if (data.data.main_plates) {
                        this.mainPlates = data.data.main_plates;
                        console.log(`🏆 加载主流板块: ${this.mainPlates.length}个`);
                    }
                    
                    // 处理主流板块指标
                    if (data.data.main_plates_metrics) {
                        this.mainPlates = data.data.main_plates_metrics;
                    }
                    
                    this.updateCurrentPlates();
                    this.renderPlatesTable();
                    this.updateStats();
                    
                    this.showMessage('数据加载完成');
                }
            }
            
            handlePlateUpdate(data) {
                console.log('🔄 处理实时更新数据');
                
                if (data.data) {
                    this.updateCount++;
                    
                    if (data.data.all_plates) {
                        this.updatePlateData(this.allPlates, data.data.all_plates, '全部板块');
                    }
                    
                    if (data.data.main_plates) {
                        this.updatePlateData(this.mainPlates, data.data.main_plates, '主流板块');
                    }
                    
                    this.lastUpdateTime = data.timestamp;
                    this.updateStats();
                    
                    if (this.autoUpdate) {
                        this.showRealTimeUpdate();
                        this.updateCurrentPlates();
                        this.updatePlatesDisplay();
                        
                        // 保持当前查看状态
                        if (this.viewState.currentMainPlate || this.viewState.currentSubPlate) {
                            this.restoreViewState();
                        }
                    }
                }
            }

            handleSubPlates(data) {
                console.log('📋 处理子板块数据:', data);
                if (this.selectedPlate && data.data) {
                    const mainStocks = this.currentStocks; // 保持当前个股数据
                    this.renderDetailView(this.selectedPlate, data.data, mainStocks);
                }
            }

            // 新增：恢复查看状态
            restoreViewState() {
                if (this.viewState.currentMainPlate) {
                    const mainPlate = this.allPlates.find(p => p.id === this.viewState.currentMainPlate.id) || 
                                    this.mainPlates.find(p => p.id === this.viewState.currentMainPlate.id);
                    if (mainPlate) {
                        this.selectedPlate = mainPlate;
                        this.loadSubPlates(mainPlate.name);
                        
                        if (this.viewState.currentSubPlate) {
                            const subPlate = this.allPlates.find(p => p.id === this.viewState.currentSubPlate.id);
                            if (subPlate) {
                                this.selectedSubPlate = subPlate;
                                this.loadStocks(subPlate.id);
                            }
                        }
                    }
                }
            }
            
            updatePlateData(existingPlates, newPlates, plateType) {
                const plateMap = new Map();
                
                existingPlates.forEach(plate => {
                    plateMap.set(plate.id, plate);
                });
                
                newPlates.forEach(newPlate => {
                    const existingPlate = plateMap.get(newPlate.id);
                    if (existingPlate) {
                        const hasChanged = this.checkPlateChanges(existingPlate, newPlate);
                        Object.assign(existingPlate, newPlate);
                    } else {
                        existingPlates.push(newPlate);
                        plateMap.set(newPlate.id, newPlate);
                    }
                });
                
                this.updateCurrentPlates();
            }
            
            checkPlateChanges(oldPlate, newPlate) {
                const fields = ['change_pct', 'total_volume', 'total_large_net', 'rise_count', 'fall_count'];
                return fields.some(field => {
                    const oldVal = oldPlate[field] || 0;
                    const newVal = newPlate[field] || 0;
                    return Math.abs(oldVal - newVal) > 0.0001;
                });
            }
            
            updateCurrentPlates() {
                this.currentPlates = this.currentPlateType === 'main' ? this.mainPlates : this.allPlates;
                this.sortCurrentPlates();
                this.updateDisplayedPlates();
            }
            
            sortCurrentPlates() {
                if (!this.currentPlates.length) return;
                
                this.currentPlates.sort((a, b) => {
                    let aVal = a[this.currentSort.field] || 0;
                    let bVal = b[this.currentSort.field] || 0;
                    
                    if (this.currentSort.direction === 'desc') {
                        return bVal - aVal;
                    } else {
                        return aVal - bVal;
                    }
                });
            }
            
            updateDisplayedPlates() {
                this.displayedPlates = this.currentPlates.slice(0, this.displayCount);
            }
            
            applySortOrder() {
                this.displayedPlates.forEach((plate, index) => {
                    const element = this.plateElements.get(plate.id);
                    if (element) {
                        element.style.order = index;
                    }
                });
            }
            
            updatePlatesDisplay() {
                if (this.plateElements.size === 0) {
                    this.renderPlatesTable();
                    return;
                }
                
                this.displayedPlates.forEach(plate => {
                    const element = this.plateElements.get(plate.id);
                    if (element) {
                        this.updatePlateElement(element, plate);
                    }
                });
                
                this.applySortOrder();
            }
            
            updatePlateElement(element, plate) {
                const changeClass = plate.change_pct >= 0 ? 'change-positive' : 'change-negative';
                const changeSign = plate.change_pct >= 0 ? '+' : '';
                
                const changeElement = element.querySelector('.change-value');
                if (changeElement) {
                    changeElement.textContent = `${changeSign}${(plate.change_pct * 100).toFixed(2)}%`;
                    changeElement.className = `change-value ${changeClass}`;
                    changeElement.classList.add('value-updated');
                    setTimeout(() => changeElement.classList.remove('value-updated'), 1000);
                }
                
                const volumeElement = element.querySelector('.volume-value');
                if (volumeElement) {
                    volumeElement.textContent = this.formatNumber(plate.total_volume);
                    volumeElement.classList.add('value-updated');
                    setTimeout(() => volumeElement.classList.remove('value-updated'), 1000);
                }
                
                const netElement = element.querySelector('.net-value');
                if (netElement) {
                    netElement.textContent = this.formatNumber(plate.total_large_net);
                    netElement.className = `net-value ${plate.total_large_net >= 0 ? 'change-positive' : 'change-negative'}`;
                    netElement.classList.add('value-updated');
                    setTimeout(() => netElement.classList.remove('value-updated'), 1000);
                }
                
                const riseFallElement = element.querySelector('.rise-fall-value');
                if (riseFallElement) {
                    riseFallElement.innerHTML = `
                        <span class="change-positive">${plate.rise_count || 0}↑</span> / 
                        <span class="change-negative">${plate.fall_count || 0}↓</span>
                    `;
                }
                
                const stockElement = element.querySelector('.stock-value');
                if (stockElement) {
                    stockElement.textContent = plate.stock_count || 0;
                }
            }

                    if (this.subPlateSort.direction === 'desc') {

                    }

                this.stats.fall = this.currentPlates.filter(p => p.change_pct < 0).length;
                
                // 计算市场上涨率

                // 计算总成交额
                const totalVolume = this.currentPlates.reduce((sum, plate) => sum + (plate.total_volume || 0), 0);
                
                document.getElementById('totalPlates').textContent = this.stats.total;
                document.getElementById('risePlates').textContent = this.stats.rise;
                document.getElementById('fallPlates').textContent = this.stats.fall;
                document.getElementById('marketRiseRate').textContent = `${marketRiseRate}%`;

            formatNumber(num) {
                if (num === undefined || num === null) return '0';
                
                const absNum = Math.abs(num);
                if (absNum >= 100000000) {
                    return (num / 100000000).toFixed(2) + '亿';
                } else if (absNum >= 10000) {
                    return (num / 10000).toFixed(0) + '万';
                }
                return num.toString();
            }
            
            refreshData() {
                // 重新连接WebSocket获取最新数据
                if (this.ws) {
                    this.ws.close();

                this.connect();
                this.showMessage('正在刷新数据...');
            }
            
            sendMessage(message) {
                if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                    this.ws.send(JSON.stringify(message));
                } else {
                    console.warn('WebSocket未连接，无法发送消息');
                    this.showMessage('连接未就绪，请等待重连...');
                }
            }
            
            showMessage(message) {
                console.log('系统消息:', message);
            }
            
            setupEventListeners() {
                document.getElementById('connectionStatus').addEventListener('click', () => {
                    this.connect();
                });
            }
            
            setupScrollLoading() {
                const container = document.getElementById('platesContainer');
                container.addEventListener('scroll', () => {
                    const { scrollTop, scrollHeight, clientHeight } = container;
                    if (scrollTop + clientHeight >= scrollHeight - 50) {
                        this.loadMorePlates();
                    }
                });
            }
            
            loadMorePlates() {
                if (this.isLoading || this.displayCount >= this.currentPlates.length) return;
                
                this.isLoading = true;
                this.displayCount += 20;
                this.updateDisplayedPlates();
                this.renderPlatesTable();
                this.isLoading = false;
            }
        }
        
        const plateMonitor = new PlateMonitor();
        
        document.addEventListener('DOMContentLoaded', function() {
            plateMonitor.init();
        });
    </script>
</body>
</html>
