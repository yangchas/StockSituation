        // T1进程控制器
        class T1Controller {
            constructor() {
                this.statusCheckInterval = null;
                this.init();
            }
            
            init() {
                // 页面加载时立即检查T1状态
                this.checkT1Status();
                
                // 优化：设置定时检查T1状态（每30秒，减少频繁请求）
                this.statusCheckInterval = setInterval(() => {
                    this.checkT1Status();
                }, 30000);
                
                // 设置默认回放日期为今天
                const today = new Date().toISOString().split('T')[0];
                document.getElementById('replayDate').value = today;
            }
            
            async checkT1Status() {
                try {
                    const response = await fetch('/api/t1/status');
                    const status = await response.json();
                    
                    this.updateUI(status);
                    
                    // 智能优化：如果T1未运行，延长下次检查间隔
                    if (!status.running) {
                        // 清除原有的定时器
                        if (this.statusCheckInterval) {
                            clearInterval(this.statusCheckInterval);
                        }
                        // 设置更长的检查间隔（2分钟）
                        this.statusCheckInterval = setInterval(() => {
                            this.checkT1Status();
                        }, 120000);
                    } else {
                        // 如果T1正在运行，保持正常检查间隔（30秒）
                        if (this.statusCheckInterval) {
                            clearInterval(this.statusCheckInterval);
                        }
                        this.statusCheckInterval = setInterval(() => {
                            this.checkT1Status();
                        }, 30000);
                    }
                } catch (error) {
                    console.error('❌ 检查T1状态失败:', error);
                    this.updateUI({ running: false, error: '连接失败' });
                }
            }
            
            updateUI(status) {
                const statusText = document.getElementById('t1StatusText');
                const startBtn = document.getElementById('t1StartBtn');
                const replayBtn = document.getElementById('t1ReplayBtn');
                const stopBtn = document.getElementById('t1StopBtn');
                
                if (status.running) {
                    statusText.innerHTML = `<span style="color: #52c41a;">运行中 (PID: ${status.pid})</span>`;
                    startBtn.style.display = 'none';
                    replayBtn.style.display = 'none';
                    stopBtn.style.display = 'inline-block';
                } else {
                    statusText.innerHTML = `<span style="color: #ff4d4f;">未运行</span>`;
                    startBtn.style.display = 'inline-block';
                    replayBtn.style.display = 'inline-block';
                    stopBtn.style.display = 'none';
                    
                    if (status.error) {
                        statusText.innerHTML = `<span style="color: #ff6b6b;">错误: ${status.error}</span>`;
                    }
                }
            }
            
            async startT1() {
                try {
                    const response = await fetch('/api/t1/start', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            mode: 'live' // 实盘模式
                        })
                    });
                    
                    const result = await response.json();
                    
                    if (result.success) {
                        console.log('🚀 T1启动成功:', result.message);
                        // 优化：延迟3秒后检查状态，避免立即频繁请求
                        setTimeout(() => {
                            this.checkT1Status();
                        }, 3000);
                    } else {
                        console.error('❌ T1启动失败:', result.message);
                        alert('T1启动失败: ' + result.message);
                    }
                } catch (error) {
                    console.error('❌ T1启动请求失败:', error);
                    alert('T1启动请求失败: ' + error.message);
                }
            }
            
            showReplayDialog() {
                document.getElementById('replayDialog').style.display = 'flex';
            }
            
            hideReplayDialog() {
                document.getElementById('replayDialog').style.display = 'none';
            }
            
            async startReplay() {
                const date = document.getElementById('replayDate').value;
                const time = document.getElementById('replayTime').value;
                const speed = document.getElementById('replaySpeed').value;
                
                if (!date) {
                    alert('请选择回放日期');
                    return;
                }
                
                if (!time) {
                    alert('请选择回放时间');
                    return;
                }
                
                try {
                    const response = await fetch('/api/t1/start', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            mode: 'replay',
                            replay_date: date,
                            replay_time: time,
                            replay_speed: parseInt(speed)
                        })
                    });
                    
                    const result = await response.json();
                    
                    if (result.success) {
                        console.log('🎯 T1回放模式启动成功:', result.message);
                        this.hideReplayDialog();
                        // 优化：延迟3秒后检查状态，避免立即频繁请求
                        setTimeout(() => {
                            this.checkT1Status();
                        }, 3000);
                    } else {
                        console.error('❌ T1回放模式启动失败:', result.message);
                        alert('T1回放模式启动失败: ' + result.message);
                    }
                } catch (error) {
                    console.error('❌ T1回放模式启动请求失败:', error);
                    alert('T1回放模式启动请求失败: ' + error.message);
                }
            }
            
            async stopT1() {
                if (!confirm('确定要停止T1进程吗？')) {
                    return;
                }
                
                try {
                    const response = await fetch('/api/t1/stop', {
                        method: 'POST'
                    });
                    
                    const result = await response.json();
                    
                    if (result.success) {
                        console.log('⏹️ T1停止成功:', result.message);
                        // 优化：延迟2秒后检查状态，避免立即频繁请求
                        setTimeout(() => {
                            this.checkT1Status();
                        }, 2000);
                    } else {
                        console.error('❌ T1停止失败:', result.message);
                        alert('T1停止失败: ' + result.message);
                    }
                } catch (error) {
                    console.error('❌ T1停止请求失败:', error);
                    alert('T1停止请求失败: ' + error.message);
                }
            }
        }
        
        // 初始化T1控制器
        let t1Controller;
        
        // 初始化股票表格
        let stockTable;
        
        window.addEventListener('load', () => {
            // 初始化T1控制器
            t1Controller = new T1Controller();
            
            // 为T1控制按钮添加事件监听器
            document.getElementById('t1StartBtn').addEventListener('click', () => {
                t1Controller.startT1();
            });
            
            document.getElementById('t1StopBtn').addEventListener('click', () => {
                t1Controller.stopT1();
            });
            
            stockTable = new OptimizedStockTable();
            
            // 从API获取初始数据
            stockTable.loadDataFromAPI().then(() => {
                // 初始数据加载完成后，启动WebSocket连接
                console.log('📊 初始数据加载完成，启动WebSocket实时更新');
                initWebSocket();
                
                // 移动端视图已移除，无需初始化
                
                // 如果WebSocket已经连接，发送订阅请求
                if (isWsConnected && ws) {
                    const stockList = stockTable.data.stocks.map(stock => stock.code);
                    if (stockList.length > 0) {
                        const subscribeMessage = {
                            type: 'subscribe',
                            stocks: stockList
                        };
                        ws.send(JSON.stringify(subscribeMessage));
                        console.log('📤 数据加载完成后发送股票订阅请求:', stockList.length, '只股票');
                    }
                }
            }).catch(() => {
                // 即使API加载失败，也尝试启动WebSocket
                console.log('⚠️ 初始数据加载失败，尝试启动WebSocket实时更新');
                initWebSocket();
            });
        });
        
        // 暴露全局函数
        window.reconnectWebSocket = reconnectWebSocket;
        

    </script>
    
    <!-- 股票详情面板 -->

    <div class="stock-detail-panel" id="stockDetailPanel">
        <div class="stock-detail-header">
            <div class="stock-detail-title">
                <div class="stock-basic-info">
                    <div class="stock-name-large" id="detailStockName">--</div>
                    <div class="stock-code-large" id="detailStockCode">--</div>
                </div>
                <div class="stock-price-large" id="detailStockPrice">--</div>
            </div>
            <button class="close-detail-btn" onclick="stockTable.closeStockDetail()">×</button>
            <div class="stock-change-info">
                <div class="stock-change" id="detailStockChange">--</div>
                <div class="stock-change-pct" id="detailStockChangePct">--</div>
                <div class="stock-volume" id="detailStockVolume">--</div>
            </div>
        </div>
        <div class="stock-detail-content">
            <div class="chart-container" id="chartContainer">
                <div class="chart-loading">图表加载中...</div>
            </div>
        </div>
    </div>
